<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM IBRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: barra laterale scura fissa + area di lavoro densa da gestionale, schede e tabelle */
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#F7F9F6; --line:#E1E6DF; --ink:#16221B; --muted:#5D6A62;
  --brand:#0E3B2C; --brand-2:#14503B; --brand-ink:#DCEBE2;
  --accent:#2C8A4B; --accent-ink:#FFFFFF; --accent-soft:#E2F1E6;
  --citrus:#D2661B; --citrus-soft:#FCEADB;
  --ok:#2C8A4B; --ok-soft:#E2F1E6; --warn:#A86A12; --warn-soft:#FBF0D8; --bad:#BC3427; --bad-soft:#FAE3E0; --info:#2862A8; --info-soft:#E2ECF8;
  --font-display:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:10px; --shadow:0 1px 2px rgba(14,40,28,.06),0 6px 18px rgba(14,40,28,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1612; --surface:#15201A; --surface-2:#1A2620; --line:#27352D; --ink:#E5EDE8; --muted:#97A69D;
    --brand:#0A2C21; --brand-2:#123D2F; --brand-ink:#CFE3D7;
    --accent:#4DB36D; --accent-ink:#0B1A12; --accent-soft:#1D3628;
    --citrus:#F08C45; --citrus-soft:#3A2617;
    --ok:#4DB36D; --ok-soft:#1D3628; --warn:#E0A43B; --warn-soft:#382B12; --bad:#EE6A5C; --bad-soft:#3D1F1B; --info:#6AA5EE; --info-soft:#18283D;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1612; --surface:#15201A; --surface-2:#1A2620; --line:#27352D; --ink:#E5EDE8; --muted:#97A69D;
  --brand:#0A2C21; --brand-2:#123D2F; --brand-ink:#CFE3D7;
  --accent:#4DB36D; --accent-ink:#0B1A12; --accent-soft:#1D3628;
  --citrus:#F08C45; --citrus-soft:#3A2617;
  --ok:#4DB36D; --ok-soft:#1D3628; --warn:#E0A43B; --warn-soft:#382B12; --bad:#EE6A5C; --bad-soft:#3D1F1B; --info:#6AA5EE; --info-soft:#18283D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* Struttura */
.demo-banner{background:var(--citrus);color:#fff;font-weight:600;font-size:12.5px;padding:6px 16px;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.demo-banner button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12px}
.app{display:grid;grid-template-columns:244px 1fr;height:calc(100% - 32px)}
.side{background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#4DB36D,#1F7A3E);display:grid;place-items:center;color:#fff;font:800 15px var(--font-display)}
.logo b{font:800 16px var(--font-display);color:#fff;display:block;line-height:1.1}
.logo span{font-size:11.5px;opacity:.75}
.nav{padding:4px 10px 18px;display:flex;flex-direction:column;gap:1px}
.nav-g{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.55;padding:14px 10px 5px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--brand-2)}
.nav a.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 #4DB36D}
.nav a .badge{margin-left:auto}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.side-foot{margin-top:auto;padding:14px 18px;font-size:11.5px;opacity:.65;border-top:1px solid rgba(255,255,255,.08)}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .burger{display:none}
.gsearch{position:relative;flex:1;max-width:460px;min-width:180px}
.gsearch input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.gsearch svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--muted)}
.gresults{position:absolute;top:40px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:30;max-height:320px;overflow:auto}
.gresults button{display:flex;width:100%;text-align:left;gap:8px;padding:8px 12px;border:0;background:none;cursor:pointer;align-items:center}
.gresults button:hover{background:var(--surface-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.user{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.user select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.content{flex:1;overflow-y:auto;padding:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* Componenti */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font:800 26px/1.15 var(--font-display);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;margin-top:4px}
.up{color:var(--ok)} .down{color:var(--bad)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.citrus{background:var(--citrus);border-color:var(--citrus);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.lg{padding:12px 18px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.citrus{background:var(--citrus-soft);color:var(--citrus);border-color:transparent}
.badge{background:var(--citrus);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:0 7px;line-height:18px}
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:13px}
.alert.warn{background:var(--warn-soft)} .alert.bad{background:var(--bad-soft)} .alert.info{background:var(--info-soft)} .alert.ok{background:var(--ok-soft)}
.alert b{font-weight:600}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.hbar{display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.chart svg{width:100%;height:auto;display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.consents{display:inline-flex;gap:4px}
.cs{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.cs.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* Cassa */
.pos{display:grid;grid-template-columns:1fr 380px;gap:16px;height:100%}
.pos-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-weight:600;cursor:pointer;font-size:12.5px}
.cats button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:96px;position:relative;overflow:hidden}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.tile b{font-weight:600;font-size:13.5px;line-height:1.25}
.tile .p{font:700 15px var(--font-display);margin-top:auto;font-variant-numeric:tabular-nums}
.tile .s{font-size:11.5px;color:var(--muted)}
.cart{display:flex;flex-direction:column;min-height:0}
.cart-lines{flex:1;overflow:auto;padding:4px 16px}
.cl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.cl .q{font-size:12px;color:var(--muted)}
.cl button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.cart-tot{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tot-row{display:flex;justify-content:space-between}
.tot-big{font:800 28px var(--font-display);font-variant-numeric:tabular-nums}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{padding:14px;font:700 18px var(--font-display);border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer}
.weight{font:800 36px var(--font-display);text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-variant-numeric:tabular-nums}

/* WhatsApp */
.wa{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 210px);min-height:440px}
.wa-list{border-right:1px solid var(--line);overflow:auto}
.wa-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.wa-item.on{background:var(--accent-soft)}
.wa-chat{display:flex;flex-direction:column;min-width:0}
.wa-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.msg{max-width:72%;padding:8px 12px;border-radius:10px;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.05)}
.msg.in{background:var(--surface);align-self:flex-start;border:1px solid var(--line)}
.msg.out{background:var(--accent-soft);align-self:flex-end}
.msg .t{font-size:10.5px;color:var(--muted);margin-top:3px;text-align:right}
.wa-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.wa-input input{flex:1;min-width:160px}
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}

/* AI */
.ai{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:460px}
.ai-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ai-q{align-self:flex-end;background:var(--brand);color:#fff;padding:9px 13px;border-radius:12px 12px 2px 12px;max-width:75%}
.ai-a{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:12px 12px 12px 2px;max-width:88%}
.ai-a .src{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer}

/* Etichetta prezzo */
.label-prev{border:2px solid var(--ink);border-radius:8px;padding:14px;max-width:320px;margin:0 auto;background:#fff;color:#111}
.label-prev .n{font:800 22px var(--font-display)}
.label-prev .pp{font:800 40px var(--font-display);text-align:right}

/* Modale e notifiche */
.overlay{position:fixed;inset:0;background:rgba(8,20,14,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal.wide{max-width:860px}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:68vh;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:380px}
.toast{background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease-out}
.toast.ok::before{content:"✓";color:#6FD68E;font-weight:700}
.toast.warn::before{content:"!";color:#F2B84B;font-weight:700}
@keyframes tin{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g3{grid-template-columns:1fr}.pos{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:32px auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .top .burger{display:grid}
  .wa{grid-template-columns:1fr;height:auto}
  .wa-list{max-height:220px;border-right:0;border-bottom:1px solid var(--line)}
  .g2{grid-template-columns:1fr}
  .content{padding:16px}
  .top{padding:10px 16px}
  .user .who{display:none}
}
@media (max-width:480px){.g4{grid-template-columns:1fr}.hbar{grid-template-columns:90px 1fr 70px}}
</style>
</head>
<body>
<div class="demo-banner" role="status">
  <span>DATI DIMOSTRATIVI · prodotti, clienti, prezzi e vendite sono inventati a scopo di prova. Nessun messaggio, pagamento o scontrino viene realmente inviato.</span>
  <button type="button" data-act="reset">Reimposta demo</button>
</div>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><div class="logo-mark">IB</div><div><b>CRM IBRA</b><span>Frutta e Verdura di Ibrahim</span></div></div>
    <nav class="nav" id="nav" aria-label="Menu principale"></nav>
    <div class="side-foot">Fontanellato (PR) · Versione dimostrativa 0.1</div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="iconbtn burger" type="button" data-act="burger" aria-label="Apri menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="gsearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-4.3-4.3"/></svg>
        <input id="gsearch" type="search" placeholder="Cerca clienti, prodotti, telefono…" autocomplete="off" aria-label="Cerca ovunque">
        <div class="gresults" id="gresults" hidden></div>
      </div>

function barChart(data,{h=200,fmt=eur,color='var(--accent)',hl=-1,every=1}={}){
  const W=640,H=h,pl=56,pb=26,pt=12,pr=8;const max=Math.max(1,...data.map(d=>d.v));
  const nice=(()=>{const e=Math.pow(10,Math.floor(Math.log10(max)));const f=max/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e})();
  const bw=(W-pl-pr)/data.length;let g='';
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(fmt(nice*i/4).replace(',00',''))}</text>`}
  data.forEach((d,i)=>{const bh=(H-pt-pb)*d.v/nice;const x=pl+i*bw+bw*.16;const y=H-pb-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw*.68}" height="${Math.max(0,bh)}" rx="3" fill="${i===hl?'var(--citrus)':color}" opacity="${i===hl||hl<0?1:.78}"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></rect>`;
    if(i%every===0)g+=`<text x="${x+bw*.34}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(d.l)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>`;
}
function hbars(rows,fmt=eur){const max=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.l)}</span><div class="bar"><i style="width:${(r.v/max*100).toFixed(1)}%;${r.c?'background:'+r.c:''}"></i></div><span class="num" style="text-align:right">${esc(fmt(r.v))}</span></div>`).join('')}

function completeSale(pag){
  const t=cartTot();const c=UI.cartCliente?cli(UI.cartCliente):null;
  const n=Math.max(0,...S.vendite.map(v=>v.n))+1;const short=[];
  UI.cart.forEach(r=>{const rest=scaricaFEFO(r.p,r.q);if(rest>0)short.push(prod(r.p).nome);S.movimenti.push({id:uid('M'),data:new Date().toISOString(),tipo:'vendita',prod:r.p,q:r.q,motivo:'Scontrino n. '+n,utente:ME().nome})});
  const punti=c&&!c.pro?Math.floor(t.tot/100):0;
  S.vendite.push({id:'V'+n,n,data:new Date().toISOString(),cliente:c?c.id:null,righe:UI.cart.map(r=>({...r})),sconto:UI.cartSconto,tot:t.tot,pag,op:ME().nome,punti,stato:'ok'});
  if(c&&punti){c.punti+=punti;S.fedeltaMov.unshift({data:new Date().toISOString(),cliente:c.id,tipo:'Accredito',punti,nota:'Scontrino n. '+n})}
  log('Vendita',`Scontrino n. ${n} · ${eur(t.tot)} · ${pag}${c?' · '+cliNome(c):''}${UI.cartSconto?' · sconto '+UI.cartSconto+'%':''}`);
  UI.cart=[];UI.cartCliente=null;UI.cartSconto=0;save();render();
  toast(`Vendita n. ${n} registrata${punti?' · +'+punti+' punti a '+c.nome:''}. Ricorda di battere lo scontrino sull'RT.`);
  if(short.length)toast('Giacenza insufficiente per: '+short.join(', ')+'. Verifica l\'inventario.','warn');
}

function crmDay(a){const b=new Date(a);b.setDate(b.getDate()+1);const vs=salesIn(new Date(a),b);return{tot:sum(vs,v=>v.tot),n:vs.length}}

  const st=r=>{if(!r.z)return r.d===0?{t:'Da inserire a fine giornata',c:'info'}:{t:'Chiusura mancante',c:'warn'};const df=r.z.rt-r.c.tot;return df===0?{t:'Quadra',c:'ok'}:{t:'Differenza '+(df>0?'+':'')+eur(df),c:'bad'}};
  return `<div class="card" style="margin-top:16px"><div class="card-h" style="flex-wrap:wrap"><div><h2>Chiusure del Registratore Telematico</h2><div class="small muted">L'RT non è collegato: ogni sera inserisci il totale della chiusura giornaliera e il CRM lo confronta con le vendite registrate.</div></div><button class="btn primary" data-act="rtClose">Registra chiusura di oggi</button></div>

  ${rows.map(r=>{const s=st(r);return `<tr><td>${r.a.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}</td><td class="r">${eur(r.c.tot)}</td><td class="r">${r.z?'<b>'+eur(r.z.rt)+'</b>':'—'}</td><td class="r">${r.c.n} / ${r.z&&r.z.docs!=null?r.z.docs:'—'}</td><td><span class="chip ${s.c}">${s.t}</span>${r.z&&r.z.nota?`<div class="small muted">${esc(r.z.nota)}</div>`:''}</td><td class="small muted">${r.z?'n. '+r.z.z+' · '+esc(r.z.fonte):''}</td></tr>`}).join('')}
  </tbody></table></div><div class="card-b small muted">Il totale ufficiale dei corrispettivi è quello dell'RT, trasmesso all'Agenzia delle Entrate. Il CRM serve a controllare e a sapere cosa si è venduto.</div></div>`;

    ['Nuovo','Primo acquisto negli ultimi 14 giorni','Messaggio di benvenuto e presentazione della tessera'],
    ['A rischio','Clienti abituali assenti da oltre 18 giorni','Messaggio personale di recupero'],

  return head('Programma fedeltà','Regola: 1 punto ogni euro speso · i punti si accumulano associando il cliente in cassa',`<button class="btn primary" data-act="redeem">${ic('star',15)} Riscatta un premio</button>`)+
  `<div class="grid g4"><div class="card kpi"><div class="l">Iscritti</div><div class="v">${act.length}</div></div><div class="card kpi"><div class="l">Punti in circolazione</div><div class="v">${tot.toLocaleString('it-IT')}</div></div><div class="card kpi"><div class="l">Clienti con premio disponibile</div><div class="v">${act.filter(c=>c.punti>=pr[0].punti).length}</div></div><div class="card kpi"><div class="l">Riscatti registrati</div><div class="v">${S.fedeltaMov.filter(m=>m.tipo==='Riscatto').length}</div></div></div>

  <div class="stack"><div class="card"><div class="card-h"><h2>Catalogo premi</h2></div><div class="card-b list">${pr.map(p=>`<div class="li"><div class="avatar" style="background:var(--citrus-soft);color:var(--citrus)">${ic('star',16)}</div><div class="grow"><b>${esc(p.nome)}</b><div class="small muted">Valore ${eur(p.valore)}</div></div><span class="chip citrus">${p.punti} punti</span></div>`).join('')}</div></div>
  <div class="card"><div class="card-h"><h2>Movimenti recenti</h2></div><div class="card-b list">${S.fedeltaMov.slice(0,8).map(m=>`<div class="li"><div class="grow"><b>${esc(cliNome(cli(m.cliente)))}</b><div class="small muted">${esc(m.tipo)} · ${esc(m.nota)} · ${fDT(m.data)}</div></div><b class="num ${m.punti<0?'down':'up'}">${m.punti>0?'+':''}${m.punti}</b></div>`).join('')||'<div class="empty small">I movimenti di questa sessione compariranno qui.</div>'}</div></div>
  <div class="alert info small">Il regolamento del programma va verificato con il consulente (normativa sulle manifestazioni a premio).</div></div></div>`;
};

  const pr=S.impostazioni.premi;const cs=S.clienti.filter(c=>!c.anon&&!c.pro&&c.punti>=pr[0].punti).sort((a,b)=>b.punti-a.punti);
  openModal('Riscatta un premio',cs.length?`<div class="field"><label for="rd-c">Cliente</label><select id="rd-c">${cs.map(c=>`<option value="${c.id}">${esc(cliNome(c))} · ${c.punti} punti</option>`).join('')}</select></div><div class="field"><label for="rd-p">Premio</label><select id="rd-p">${pr.map((p,i)=>`<option value="${i}">${esc(p.nome)} · ${p.punti} punti</option>`).join('')}</select></div>`:'<div class="empty">Nessun cliente ha ancora punti sufficienti.</div>',
  cs.length?[{label:'Annulla'},{label:'Conferma riscatto',cls:'primary',fn:()=>{const c=cli(val('rd-c')),p=pr[+val('rd-p')];if(c.punti<p.punti){toast('Punti insufficienti per questo premio.','warn');return false}c.punti-=p.punti;S.fedeltaMov.unshift({data:new Date().toISOString(),cliente:c.id,tipo:'Riscatto',punti:-p.punti,nota:p.nome});log('Riscatto premio',cliNome(c)+' · '+p.nome);render();toast(`Premio "${p.nome}" riscattato da ${c.nome}.`)}}]:[{label:'Chiudi'}]);
}

/* ---- Recupero e recensioni ---- */
VIEWS.recupero=()=>{
  const m=custMetrics();const risk=S.clienti.filter(c=>!c.anon&&['A rischio','Perso'].includes(m[c.id].seg)).sort((a,b)=>m[b.id].spesa-m[a.id].spesa);
  const avg=S.feedback.length?sum(S.feedback,f=>f.voto)/S.feedback.length:0;
  return head('Recupero clienti, recensioni e referral','Clienti abituali che non tornano da tempo, opinioni raccolte e passaparola')+
  `<div class="card"><div class="card-h"><h2>Clienti da recuperare</h2><span class="chip warn">${risk.length}</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Cliente</th><th>Assente da</th><th class="r">Spesa abituale (45 gg)</th><th>Consenso marketing</th><th></th></tr></thead><tbody>${risk.map(c=>{const x=m[c.id];return `<tr><td><b>${esc(cliNome(c))}</b><div class="small muted">${segChip(x.seg)}</div></td><td>${x.giorni} giorni</td><td class="r">${eur(x.spesa)}</td><td>${c.consensi.marketing?'<span class="chip ok">Sì</span>':'<span class="chip">No</span>'}</td><td class="r">${c.consensi.marketing?`<button class="btn sm primary" data-act="recover" data-v="${c.id}">Proponi messaggio</button>`:'<span class="small muted">Solo contatto in negozio</span>'}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">Nessun cliente a rischio</td></tr>'}</tbody></table></div></div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><div class="card-h"><h2>Opinioni dei clienti</h2><span class="chip ok">Media ${avg.toLocaleString('it-IT',{maximumFractionDigits:1})} / 5</span></div><div class="card-b list">${S.feedback.map(f=>`<div class="li"><div class="grow"><div style="color:var(--citrus)">${'★'.repeat(f.voto)}<span class="muted">${'★'.repeat(5-f.voto)}</span></div><div>${esc(f.testo)}</div><div class="small muted">${esc(cliNome(cli(f.cliente)))} · ${fD(f.data)}</div></div></div>`).join('')}</div><div class="card-b small muted" style="border-top:1px solid var(--line)">Le richieste di recensione su Google partono solo con consenso e senza premi legati al giudizio positivo.</div></div>
  <div class="card"><div class="card-h"><h2>Presenta un amico</h2><span class="chip info">${S.referral.length} presentazioni</span></div><div class="card-b list">${S.referral.map(r=>`<div class="li"><div class="grow"><b>${esc(cliNome(cli(r.da)))}</b> ha presentato <b>${esc(cliNome(cli(r.a)))}</b><div class="small muted">Codice ${esc(r.codice)} · ${fD(r.data)}</div></div><span class="chip ${r.stato.startsWith('Premio')?'ok':'warn'}">${esc(r.stato)}</span></div>`).join('')}</div><div class="card-b small muted" style="border-top:1px solid var(--line)">Premio demo: 50 punti a entrambi dopo il primo acquisto del nuovo cliente.</div></div></div>`;
};

/* ---- WhatsApp ---- */
VIEWS.whatsapp=()=>{
  const conv=S.conversazioni.filter(w=>cli(w.cliente)).sort((a,b)=>new Date(b.msgs.at(-1)?.t||0)-new Date(a.msgs.at(-1)?.t||0));
  const sel=conv.find(w=>w.id===UI.waSel)||conv[0];
  if(sel&&sel.nonLetti){sel.nonLetti=0;save();setTimeout(renderNav,0)}
  const c=sel?cli(sel.cliente):null;
  const lastIn=sel?[...sel.msgs].reverse().find(m=>m.dir==='in'):null;
  const in24=lastIn&&(NOW-new Date(lastIn.t))<864e5;
  const qr=['Buongiorno! Certo, gliela mettiamo da parte.','Sì, consegniamo a Fontanellato e nei comuni vicini. Che orario preferisce?','Il suo ordine è pronto per il ritiro.','Grazie, a presto!'];
  return head('WhatsApp','Casella condivisa del negozio · WhatsApp Business Platform',`<span class="chip citrus">Simulazione: nessun messaggio viene inviato</span>`)+
  `<div class="card wa"><div class="wa-list">${conv.map(w=>{const cc=cli(w.cliente);const lm=w.msgs.at(-1);return `<button class="wa-item ${sel&&w.id===sel.id?'on':''}" data-act="waSel" data-v="${w.id}"><div class="avatar">${ini(cc)}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(cliNome(cc))}</b><span class="small muted">${lm?fT(lm.t):''}</span></div><div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lm?esc(lm.testo):'Nuova conversazione'}</div></div>${w.nonLetti?`<span class="badge">${w.nonLetti}</span>`:''}</button>`}).join('')}</div>
  <div class="wa-chat">${sel?`<div class="card-h"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${ini(c)}</div><div><b>${esc(cliNome(c))}</b><div class="small muted">${esc(c.tel)} · marketing: ${c.consensi.marketing?'sì':'no'}</div></div></div><div class="actions"><button class="btn sm" data-act="cliOpen" data-v="${c.id}">Scheda</button><button class="btn sm" data-act="waOrder" data-v="${c.id}">Crea ordine</button><button class="btn sm" data-act="waStop" data-v="${sel.id}" title="Simula la risposta STOP del cliente">Simula «STOP»</button></div></div>
   <div class="wa-msgs" id="wa-msgs">${sel.msgs.map(m=>`<div class="msg ${m.dir}">${esc(m.testo)}<div class="t">${fDT(m.t)}${m.dir==='out'?' · '+(m.sim?'simulato':'✓✓'):''}</div></div>`).join('')||'<div class="empty">Nessun messaggio. Fuori dalla finestra di 24 ore puoi usare solo modelli approvati da Meta.</div>'}</div>
   ${in24?`<div class="qr">${qr.map((q,i)=>`<button class="chip" style="cursor:pointer" data-act="waQR" data-v="${i}">${esc(q.slice(0,34))}…</button>`).join('')}</div>`:''}
   <div class="wa-input">${in24?`<input class="inp" id="wa-in" placeholder="Scrivi una risposta…" aria-label="Messaggio"><button class="btn primary" data-act="waSend" data-v="${sel.id}">${ic('send',15)} Invia</button>`:`<div class="alert info small" style="flex:1">Ultimo messaggio del cliente oltre le 24 ore: per scrivere serve un modello approvato (es. «Ordine pronto»).</div><button class="btn" data-act="waTpl" data-v="${sel.id}">Usa modello «Ordine pronto»</button>`}</div>`:'<div class="empty">Nessuna conversazione</div>'}</div></div>`;
};

/* ---- Campagne ---- */
VIEWS.campagne=()=>{

  return head('Campagne marketing','Ogni invio richiede l\'approvazione del titolare e raggiunge solo chi ha dato il consenso',`<button class="btn primary" data-act="newCamp" data-v="Tutti con consenso">${ic('plus',15)} Nuova campagna</button>`)+
  `<div class="stack">${S.campagne.slice().reverse().map(k=>`<div class="card"><div class="card-h" style="flex-wrap:wrap"><div><h2>${esc(k.nome)}</h2><div class="small muted">Segmento: ${esc(k.segmento)} · creata il ${fD(k.creata)}${k.inviata?' · inviata il '+fD(k.inviata):''}</div></div><div class="actions"><span class="chip ${st[k.stato]}">${k.stato[0].toUpperCase()+k.stato.slice(1)}</span>${k.stato==='approvata'?`<button class="btn sm primary" data-act="campSend" data-v="${k.id}">Avvia invio (simulato)</button>`:''}${k.stato==='bozza'?`<button class="btn sm" data-act="campSubmit" data-v="${k.id}">Invia per approvazione</button>`:''}</div></div>

   <div>${k.stato==='inviata'?`<div class="grid g2 small"><div><span class="muted">Destinatari</span><div class="kpi" style="padding:0"><div class="v" style="font-size:20px">${k.dest}</div></div></div><div><span class="muted">Esclusi (no consenso)</span><div class="kpi" style="padding:0"><div class="v" style="font-size:20px">${k.esclusi}</div></div></div><div><span class="muted">Letti</span><div class="kpi" style="padding:0"><div class="v" style="font-size:20px">${k.letti} <span class="small muted">(${Math.round(k.letti/Math.max(1,k.dest)*100)}%)</span></div></div></div><div><span class="muted">Risposte</span><div class="kpi" style="padding:0"><div class="v" style="font-size:20px">${k.risposte}</div></div></div></div>`:(()=>{const d=destinatari(k.segmento);return `<div class="small">Raggiungerebbe <b>${d.ok.length}</b> clienti con consenso. <b>${d.esclusi.length}</b> esclusi automaticamente.</div>`})()}</div></div></div>`).join('')}</div>`;

  <div class="small muted">Limite: massimo ${S.impostazioni.limiteMsgMese} messaggi promozionali al mese per cliente.</div>`,
  [{label:'Annulla'},{label:'Invia per approvazione',cls:'primary',fn:()=>{const n=val('cp-n'),t=val('cp-t'),s=val('cp-s');if(!n){toast('Dai un nome alla campagna.','warn');return false}if(!/stop/i.test(t)){toast('Il messaggio deve spiegare come disiscriversi (es. "rispondi STOP").','warn');return false}
    const k={id:uid('K'),nome:n,segmento:s,testo:t,stato:'in approvazione',creata:new Date().toISOString(),dest:0,esclusi:0};S.campagne.push(k);
    S.approvazioni.unshift({id:uid('A'),tipo:'campagna',ref:k.id,titolo:`Invio campagna "${n}"`,dettaglio:`Segmento ${s} · ${destinatari(s).ok.length} destinatari con consenso`,richiedente:ME().nome+' ('+ME().ruolo+')',data:new Date().toISOString(),stato:'in attesa'});
    log('Campagna',`"${n}" inviata per approvazione`);location.hash='campagne';render();toast('Campagna inviata per approvazione. Riceverai una notifica appena sarà valutata.')}}]);

}

/* ---- Prodotti ---- */
VIEWS.prodotti=()=>{
  let ps=S.prodotti;if(UI.prodQ){const q=norm(UI.prodQ);ps=ps.filter(p=>norm(p.nome+p.cat+p.origine).includes(q)||p.plu===UI.prodQ)}
  return head('Prodotti e listini',`${S.prodotti.length} articoli · listino al banco · prezzi e aliquote IVA dimostrativi, da verificare con il commercialista`)+
  `<div class="card"><div class="card-h"><input class="inp" style="max-width:280px" id="prod-q" data-in="prodQ" placeholder="Cerca prodotto, categoria o origine" value="${esc(UI.prodQ)}" aria-label="Cerca prodotti"><span class="small muted">Tocca una riga per modificare il prezzo o stampare il cartellino</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Prodotto</th><th>PLU</th><th>Categoria</th><th>Origine</th><th>Cat. comm.</th><th class="r">Costo</th><th class="r">Prezzo</th><th class="r">Margine</th><th class="r">IVA</th><th class="r">Giacenza</th></tr></thead><tbody>
  ${ps.map(p=>{const g=giacenza(p.id);const mg=(p.prezzo-p.costo)/p.prezzo*100;return `<tr class="click" data-act="prodOpen" data-v="${p.id}"><td><b>${esc(p.nome)}</b>${p.bio?' <span class="chip ok">Bio</span>':''}</td><td class="num">${p.plu}</td><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COL[p.cat]};margin-right:6px"></span>${esc(p.cat)}</td><td>${esc(p.origine)}</td><td>${p.categoria}</td><td class="r">${eur(p.costo)}</td><td class="r"><b>${eur(p.prezzo)}</b>/${p.unita}</td><td class="r"><span class="chip ${mg<40?'warn':'ok'}">${mg.toFixed(0)}%</span></td><td class="r">${p.iva}%</td><td class="r" style="color:${g<p.soglia?'var(--bad)':'inherit'}">${fmtQ(g,p.unita)}</td></tr>`}).join('')}
  </tbody></table></div></div>`;

function prodModal(id){
  const p=prod(id);

  openModal(p.nome,`<div class="grid g2"><div class="field"><label for="pp-p">Prezzo di vendita (€/${p.unita})</label><input id="pp-p" class="num" value="${(p.prezzo/100).toFixed(2).replace('.',',')}" ${isTit()?'':'disabled'}></div><div class="field"><label>Costo d'acquisto ultimo lotto</label><input value="${eur(p.costo)}" disabled></div></div>
  ${isTit()?'':'<div class="alert info small">Solo il titolare può modificare i prezzi.</div>'}
  <div class="small muted">Variazioni oltre il 15% vengono registrate come operazione sensibile.</div>
  <h3>Anteprima cartellino</h3><div class="label-prev"><div class="n">${esc(p.nome)}</div><div style="font-size:12px">Origine: <b>${esc(p.origine)}</b> · Categoria: <b>${p.categoria}</b>${p.bio?' · Biologico':''}</div><div class="pp">${eur(p.prezzo)}<span style="font-size:16px"> /${p.unita}</span></div><div style="font-size:11px;display:flex;justify-content:space-between"><span>PLU ${p.plu}</span><span>Frutta e Verdura di Ibrahim</span></div></div>
  ${hist.length?`<h3>Storico variazioni</h3>${hist.map(h=>`<div class="small">${fDT(h.data)} · ${esc(h.dettaglio)}</div>`).join('')}`:''}`,
  [{label:'Chiudi'},{label:'Salva prezzo',cls:'primary',dis:!isTit(),fn:()=>{const v=Math.round(parseFloat(val('pp-p').replace(',','.'))*100);if(!v||v<=0){toast('Inserisci un prezzo valido.','warn');return false}if(v===p.prezzo)return;const old=p.prezzo;const ch=(v-old)/old*100;
    const apply=()=>{p.prezzo=v;log('Prezzo',`${p.nome}: da ${eur(old)} a ${eur(v)} (${pct(ch)})`);render();toast('Prezzo aggiornato. Ricorda di aggiornare il cartellino e la bilancia.')};
    if(Math.abs(ch)>15){ask('Confermi la variazione?',`Il prezzo di <b>${esc(p.nome)}</b> cambia del <b>${pct(ch)}</b> (da ${eur(old)} a ${eur(v)}).`,'Conferma variazione',apply);return false}apply()}}],true);

/* ---- Magazzino ---- */
VIEWS.magazzino=()=>{
  const tabs=[['giacenze','Giacenze'],['lotti','Lotti e scadenze'],['scarti','Scarti'],['movimenti','Movimenti']];
  let body='';
  if(UI.magTab==='giacenze'){
    const valore=sum(S.lotti,l=>Math.round(l.res*l.costo));
    body=`<div class="grid g4" style="margin-bottom:16px"><div class="card kpi"><div class="l">Valore merce a costo</div><div class="v">${eur(valore)}</div></div><div class="card kpi"><div class="l">Sotto scorta</div><div class="v" style="color:var(--bad)">${lowStock().length}</div></div><div class="card kpi"><div class="l">Lotti da vendere entro domani</div><div class="v" style="color:var(--warn)">${expiring(1).length}</div></div><div class="card kpi"><div class="l">Lotti attivi</div><div class="v">${S.lotti.filter(l=>l.res>0).length}</div></div></div>
    <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Prodotto</th><th class="r">Giacenza</th><th style="width:30%">Rispetto alla scorta minima</th><th class="r">Scorta minima</th><th>Fornitore abituale</th><th></th></tr></thead><tbody>${S.prodotti.map(p=>{const g=giacenza(p.id);const r=Math.min(100,g/(p.soglia*3)*100);return `<tr><td><b>${esc(p.nome)}</b></td><td class="r">${fmtQ(g,p.unita)}</td><td><div class="bar"><i class="${g<p.soglia?'bad':g<p.soglia*1.5?'warn':''}" style="width:${r}%"></i></div></td><td class="r">${fmtQ(p.soglia,p.unita)}</td><td>${esc(forn(p.forn).nome)}</td><td class="r"><button class="btn sm" data-act="scarto" data-v="${p.id}">Scarto</button> <button class="btn sm" data-act="rettifica" data-v="${p.id}">Inventario</button></td></tr>`}).join('')}</tbody></table></div></div>`;
  }else if(UI.magTab==='lotti'){
    const ls=S.lotti.filter(l=>l.res>0).sort((a,b)=>new Date(a.scadenza)-new Date(b.scadenza));
    body=`<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Lotto</th><th>Prodotto</th><th>Fornitore</th><th>Arrivo</th><th>Origine</th><th class="r">Residuo</th><th>Vendere entro</th><th>Stato</th><th></th></tr></thead><tbody>${ls.map(l=>{const p=prod(l.prod);const s=lotStatus(l);return `<tr><td class="num">${l.id}<div class="small muted">${esc(l.ddt)}</div></td><td><b>${esc(p.nome)}</b></td><td>${esc(forn(l.forn).nome)}</td><td>${fD(l.arrivo)}</td><td>${esc(l.origine)}</td><td class="r">${fmtQ(l.res,p.unita)}</td><td>${fD(l.scadenza)}</td><td><span class="chip ${s.c}">${s.t}</span></td><td class="r">${['bad','warn'].includes(s.c)?`<button class="btn sm citrus" data-act="promoLot" data-v="${l.id}">Proponi promo</button>`:''}</td></tr>`}).join('')}</tbody></table></div><div class="card-b small muted">Le vendite scaricano automaticamente prima i lotti con la data più vicina (FEFO). Tracciabilità: ogni lotto conserva fornitore, origine e documento di trasporto.</div></div>`;
  }else if(UI.magTab==='scarti'){
    const sc=S.movimenti.filter(m=>m.tipo==='scarto'&&diffDays(NOW,m.data)<30);
    const byP={};sc.forEach(m=>{const p=prod(m.prod);byP[m.prod]=(byP[m.prod]||0)+Math.round(m.q*p.costo)});
    const byM={};sc.forEach(m=>{byM[m.motivo]=(byM[m.motivo]||0)+Math.round(m.q*prod(m.prod).costo)});
    body=`<div class="grid g2"><div class="card"><div class="card-h"><h2>Valore scarti per prodotto · 30 giorni</h2><b class="num">${eur(sum(Object.values(byP),x=>x))}</b></div><div class="card-b">${hbars(Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([p,v])=>({l:prod(p).nome,v,c:'var(--bad)'})))}</div></div>
    <div class="card"><div class="card-h"><h2>Per motivo</h2></div><div class="card-b">${hbars(Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:k,v,c:'var(--warn)'})))}</div><div class="card-b"><button class="btn primary" data-act="scarto" data-v="">${ic('plus',15)} Registra scarto</button></div></div></div>`;
  }else{
    const mv=S.movimenti.slice().sort((a,b)=>new Date(b.data)-new Date(a.data)).slice(0,80);
    body=`<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Data</th><th>Tipo</th><th>Prodotto</th><th class="r">Quantità</th><th>Causale</th><th>Utente</th></tr></thead><tbody>${mv.map(m=>{const p=prod(m.prod);const col={carico:'ok',vendita:'info',scarto:'bad',rettifica:'warn'}[m.tipo];return `<tr><td class="num">${fDT(m.data)}</td><td><span class="chip ${col}">${m.tipo}</span></td><td>${esc(p.nome)}</td><td class="r">${m.tipo==='carico'?'+':m.tipo==='rettifica'?(m.q>=0?'+':''):'−'}${fmtQ(Math.abs(m.q),p.unita)}</td><td>${esc(m.motivo)}</td><td>${esc(m.utente)}</td></tr>`}).join('')}</tbody></table></div></div>`;
  }
  return head('Magazzino','Giacenze in tempo reale per lotto, scadenze e scarti')+`<div class="tabs">${tabs.map(([k,l])=>`<button data-act="magTab" data-v="${k}" class="${UI.magTab===k?'on':''}">${l}</button>`).join('')}</div>`+body;
};
function scartoModal(pid){
  openModal('Registra scarto',`<div class="field"><label for="sc-p">Prodotto</label><select id="sc-p">${S.prodotti.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.nome)} · giacenza ${fmtQ(giacenza(p.id),p.unita)}</option>`).join('')}</select></div>
  <div class="grid g2"><div class="field"><label for="sc-q">Quantità</label><input id="sc-q" class="num" inputmode="decimal" placeholder="es. 1,5"></div><div class="field"><label for="sc-m">Motivo</label><select id="sc-m"><option>Deperimento</option><option>Danneggiato</option><option>Invenduto</option><option>Calo peso</option><option>Omaggio</option></select></div></div>`,
  [{label:'Annulla'},{label:'Registra',cls:'primary',fn:()=>{const p=prod(val('sc-p'));const q=parseFloat(val('sc-q').replace(',','.'));if(!q||q<=0){toast('Inserisci una quantità valida.','warn');return false}if(q>giacenza(p.id)){toast('La quantità supera la giacenza disponibile.','warn');return false}scaricaFEFO(p.id,q);S.movimenti.push({id:uid('M'),data:new Date().toISOString(),tipo:'scarto',prod:p.id,q,motivo:val('sc-m'),utente:ME().nome});log('Scarto',`${p.nome} · ${fmtQ(q,p.unita)} · ${val('sc-m')}`);render();toast('Scarto registrato.')}}]);
}
function rettificaModal(pid){
  const p=prod(pid);const g=giacenza(pid);
  openModal('Inventario · '+p.nome,`<div class="small muted">Giacenza a sistema: <b>${fmtQ(g,p.unita)}</b></div><div class="field"><label for="rt-q">Quantità contata (${p.unita})</label><input id="rt-q" class="num" inputmode="decimal"></div>${isTit()?'':'<div class="alert info small">Le rettifiche superiori al 10% richiedono l\'approvazione del titolare.</div>'}`,
  [{label:'Annulla'},{label:'Salva conteggio',cls:'primary',fn:()=>{const q=parseFloat(val('rt-q').replace(',','.'));if(isNaN(q)||q<0){toast('Inserisci la quantità contata.','warn');return false}const d=Math.round((q-g)*1000)/1000;if(!d){toast('Nessuna differenza: giacenza confermata.');return}
    if(d<0)scaricaFEFO(pid,-d);else{const l=S.lotti.filter(x=>x.prod===pid).sort((a,b)=>new Date(b.scadenza)-new Date(a.scadenza))[0];if(l)l.res=Math.round((l.res+d)*1000)/1000}
    S.movimenti.push({id:uid('M'),data:new Date().toISOString(),tipo:'rettifica',prod:pid,q:d,motivo:'Inventario',utente:ME().nome});log('Rettifica inventario',`${p.nome}: ${d>0?'+':''}${fmtQ(d,p.unita)}`);render();toast('Inventario aggiornato.')}}]);
}

VIEWS.ordini=()=>{
  const nxt={'Confermato':'In preparazione','In preparazione':'Pronto','Pronto':'Consegnato'};
  let body='';
  if(UI.ordTab==='clienti'){
    body=`<div class="card"><div class="card-h"><h2>Ordini e prenotazioni clienti</h2><button class="btn primary sm" data-act="newOrd" data-v="">${ic('plus',14)} Nuovo ordine</button></div><div class="tblwrap"><table class="tbl"><thead><tr><th>N.</th><th>Cliente</th><th>Tipo</th><th>Per il</th><th>Articoli</th><th>Canale</th><th>Stato</th><th class="r">Importo stimato</th><th></th></tr></thead><tbody>${S.ordini.slice().sort((a,b)=>b.n-a.n).map(o=>{const imp=sum(o.righe,r=>Math.round(r.q*prod(r.p).prezzo));const cls={'Confermato':'info','In preparazione':'warn','Pronto':'citrus','Consegnato':'ok','Annullato':'bad'}[o.stato];return `<tr><td class="num">${o.n}</td><td><b>${esc(cliNome(cli(o.cliente)))}</b></td><td>${o.tipo}</td><td class="num">${fDT(o.data)}</td><td class="small">${o.righe.map(r=>esc(prod(r.p).nome)+' '+fmtQ(r.q,prod(r.p).unita)).join(', ')}</td><td>${o.canale}</td><td><span class="chip ${cls}">${o.stato}</span></td><td class="r">${eur(imp)}</td><td class="r">${nxt[o.stato]?`<button class="btn sm" data-act="ordNext" data-v="${o.id}">Segna «${nxt[o.stato]}»</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;
  }else{
    const low=lowStock();
    body=`${low.length?`<div class="alert warn" style="margin-bottom:16px"><span style="flex:1"><b>${low.length} prodotti sotto scorta:</b> ${low.map(p=>esc(p.nome)).join(', ')}</span><button class="btn sm primary" data-act="reorder">Prepara proposta di riordino</button></div>`:''}
    <div class="card"><div class="card-h"><h2>Ordini ai fornitori</h2></div><div class="tblwrap"><table class="tbl"><thead><tr><th>N.</th><th>Fornitore</th><th>Data ordine</th><th>Consegna prevista</th><th>Righe</th><th>Stato</th><th class="r">Totale</th><th></th></tr></thead><tbody>${S.acquisti.slice().sort((a,b)=>b.n-a.n).map(o=>{const tot=sum(o.righe,r=>Math.round(r.q*r.c));const cls={'Bozza':'','In approvazione':'warn','Inviato':'info','Ricevuto':'ok'}[o.stato];return `<tr><td class="num">${o.n}</td><td><b>${esc(forn(o.forn).nome)}</b></td><td>${fD(o.data)}</td><td>${fD(o.consegna)}</td><td class="small">${o.righe.map(r=>esc(prod(r.p).nome)+' '+fmtQ(r.q,prod(r.p).unita)).join(', ')}</td><td><span class="chip ${cls}">${o.stato}</span></td><td class="r">${eur(tot)}</td><td class="r">${o.stato==='Inviato'?`<button class="btn sm primary" data-act="receive" data-v="${o.id}">Ricevi merce</button>`:''}</td></tr>`}).join('')}</tbody></table></div></div>`;
  }
  return head('Ordini','Prenotazioni e consegne ai clienti, ordini d\'acquisto ai fornitori')+`<div class="tabs"><button data-act="ordTab" data-v="clienti" class="${UI.ordTab==='clienti'?'on':''}">Ordini clienti</button><button data-act="ordTab" data-v="fornitori" class="${UI.ordTab==='fornitori'?'on':''}">Ordini fornitori</button></div>`+body;
};
function newOrdModal(cid){
  openModal('Nuovo ordine cliente',`<div class="field"><label for="no-c">Cliente</label><select id="no-c">${S.clienti.filter(c=>!c.anon).map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(cliNome(c))}</option>`).join('')}</select></div>
  <div class="grid g2"><div class="field"><label for="no-t">Tipo</label><select id="no-t"><option>Ritiro</option><option>Consegna</option></select></div><div class="field"><label for="no-d">Data e ora</label><input id="no-d" type="datetime-local" value="${(()=>{const d=new Date(NOW.getTime()+864e5);d.setHours(10,0,0,0);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)})()}"></div></div>
  <div class="grid g2"><div class="field"><label for="no-p">Prodotto</label><select id="no-p">${S.prodotti.map(p=>`<option value="${p.id}">${esc(p.nome)} · ${eur(p.prezzo)}/${p.unita}</option>`).join('')}</select></div><div class="field"><label for="no-q">Quantità</label><input id="no-q" class="num" value="1"></div></div>
  <div class="field"><label for="no-n">Note</label><input id="no-n" placeholder="es. citofonare, consegna entro le 10"></div>`,
  [{label:'Annulla'},{label:'Crea ordine',cls:'primary',fn:()=>{const q=parseFloat(val('no-q').replace(',','.'));if(!q||q<=0){toast('Inserisci una quantità valida.','warn');return false}const n=Math.max(...S.ordini.map(o=>o.n))+1;S.ordini.push({id:uid('O'),n,cliente:val('no-c'),tipo:val('no-t'),data:new Date(val('no-d')).toISOString(),righe:[{p:val('no-p'),q}],stato:'Confermato',canale:location.hash==='#whatsapp'?'WhatsApp':'Negozio',note:val('no-n')});log('Ordine cliente',`Ordine n. ${n} per ${cliNome(cli(val('no-c')))}`);UI.ordTab='clienti';location.hash='ordini';render();toast(`Ordine n. ${n} creato.`)}}]);
}
function reorderModal(){
  const low=lowStock();const byF={};low.forEach(p=>{(byF[p.forn]=byF[p.forn]||[]).push({p:p.id,q:p.unita==='kg'?Math.max(10,p.soglia*3-Math.floor(giacenza(p.id))):p.soglia*3,c:p.costo})});
  const tot=sum(Object.values(byF).flat(),r=>r.q*r.c);
  openModal('Proposta di riordino',`<div class="small muted">Calcolata su scorta minima × 3 meno la giacenza attuale. Puoi modificarla prima dell'invio.</div>${Object.entries(byF).map(([f,rs])=>`<div class="card"><div class="card-h"><h3>${esc(forn(f).nome)}</h3><span class="small muted">${esc(forn(f).giorni)}</span></div><div class="card-b small">${rs.map(r=>`<div class="tot-row"><span>${esc(prod(r.p).nome)}</span><span class="num">${fmtQ(r.q,prod(r.p).unita)} · ${eur(r.q*r.c)}</span></div>`).join('')}</div></div>`).join('')}<div class="tot-row"><b>Totale stimato</b><b class="num">${eur(tot)}</b></div>${tot>S.impostazioni.ordineSoglia||!isTit()?'<div class="alert warn small">Importo sopra soglia o ruolo senza autorizzazione: l\'ordine passa dalle approvazioni.</div>':''}`,
  [{label:'Annulla'},{label:tot>S.impostazioni.ordineSoglia||!isTit()?'Invia per approvazione':'Invia ordini ai fornitori',cls:'primary',fn:()=>{
    const needs=tot>S.impostazioni.ordineSoglia||!isTit();let n=Math.max(...S.acquisti.map(o=>o.n));
    Object.entries(byF).forEach(([f,rs])=>{const c=dayStart(NOW);c.setDate(c.getDate()+1);const o={id:uid('PO'),n:++n,forn:f,data:new Date().toISOString(),consegna:c.toISOString(),righe:rs,stato:needs?'In approvazione':'Inviato'};S.acquisti.push(o);
      if(needs)S.approvazioni.unshift({id:uid('A'),tipo:'ordine',ref:o.id,titolo:`Ordine n. ${o.n} a ${forn(f).nome}`,dettaglio:`${rs.length} prodotti · ${eur(sum(rs,r=>r.q*r.c))}`,richiedente:ME().nome+' ('+ME().ruolo+')',data:new Date().toISOString(),stato:'in attesa'})});
    log('Riordino',needs?'Proposta di riordino inviata per approvazione':'Ordini inviati ai fornitori');UI.ordTab='fornitori';render();toast(needs?'Proposta inviata per approvazione.':'Ordini registrati come inviati (in demo non parte nessuna comunicazione).')}}],true);
}
function receive(id){
  const o=S.acquisti.find(x=>x.id===id);
  openModal('Ricevimento merce · ordine n. '+o.n,`<div class="small muted">${esc(forn(o.forn).nome)} · controlla quantità e qualità, poi conferma: verranno creati i lotti.</div>${o.righe.map((r,i)=>{const p=prod(r.p);return `<div class="grid g2" style="align-items:end"><div><b>${esc(p.nome)}</b><div class="small muted">Ordinati ${fmtQ(r.q,p.unita)} · ${esc(p.origine)}</div></div><div class="field"><label for="rc-${i}">Ricevuti</label><input id="rc-${i}" class="num" value="${String(r.q).replace('.',',')}"></div></div>`}).join('')}<div class="field"><label for="rc-ddt">N. documento di trasporto</label><input id="rc-ddt" value="DDT ${100+o.n}/${NOW.getFullYear()}"></div>`,
  [{label:'Annulla'},{label:'Conferma ricevimento',cls:'primary',fn:()=>{const ddt=val('rc-ddt');o.righe.forEach((r,i)=>{const q=parseFloat(val('rc-'+i).replace(',','.'))||0;if(q<=0)return;const p=prod(r.p);const sh=p.cat==='Agrumi'?14:9;const sc=dayStart(NOW);sc.setDate(sc.getDate()+sh);const lid='L'+String(S.lotti.length+1).padStart(4,'0');S.lotti.push({id:lid,prod:p.id,forn:o.forn,arrivo:new Date().toISOString(),qi:q,res:q,costo:r.c,origine:p.origine,scadenza:sc.toISOString(),ddt});p.costo=r.c;S.movimenti.push({id:uid('M'),data:new Date().toISOString(),tipo:'carico',prod:p.id,q,motivo:ddt,utente:ME().nome,lotto:lid})});{const fo=forn(o.forn);const gg=+((fo.pagamento.match(/(\d+) gg/)||[0,0])[1]);const imp=Math.round(sum(o.righe,r=>r.q*r.c));const iva=Math.round(imp*.04);const sc=dayStart(NOW);sc.setDate(sc.getDate()+gg);S.fatture.push({id:uid('FA'),num:'Fatt. su '+ddt,forn:o.forn,data:new Date().toISOString(),scadenza:sc.toISOString(),imp,iva,tot:imp+iva,stato:'Da pagare',pagataIl:null,metodo:'',ordine:o.n})}o.stato='Ricevuto';log('Ricevimento merce',`Ordine n. ${o.n} · ${ddt}`);render();toast('Merce caricata: lotti creati e giacenze aggiornate.')}}],true);
}

/* ---- Fornitori, acquisti, spese, conto economico ---- */
function payState(x){if(x.stato==='Pagata')return{t:'Pagata',c:'ok'};const g=diffDays(x.scadenza,NOW);if(g<0)return{t:'Scaduta da '+(-g)+' gg',c:'bad'};if(g<=7)return{t:g===0?'Scade oggi':'Scade tra '+g+' gg',c:'warn'};return{t:'Da pagare',c:'info'}}
const mStart=()=>new Date(NOW.getFullYear(),NOW.getMonth(),1);
const inPer=(d,a,b)=>{const x=new Date(d);return x>=a&&x<b};
const kpi=(l,v,d,col)=>`<div class="card kpi"><div class="l">${l}</div><div class="v"${col?` style="color:${col}"`:''}>${v}</div>${d?`<div class="d muted">${d}</div>`:''}</div>`;
const SPESE_CAT=['Affitto','Energia elettrica','Gas e acqua','Telefono e internet','Commercialista','Assicurazione','Tasse e tributi','Commissioni bancarie','Trasporti','Imballaggi','Manutenzione','Personale','Altro'];

VIEWS.fornitori=()=>{
  const d30=daysAgo(29);
  return head('Fornitori',`${S.fornitori.length} fornitori · condizioni, prodotti, acquisti e pagamenti`,`<button class="btn" data-act="go" data-v="acquisti">${ic('invoice',15)} Fatture d'acquisto</button><button class="btn primary" data-act="newForn" ${isTit()?'':'disabled'}>${ic('plus',15)} Nuovo fornitore</button>`)+
  `<div class="grid g2">${S.fornitori.map(f=>{
    const ps=S.prodotti.filter(p=>p.forn===f.id);
    const sc=S.movimenti.filter(m=>m.tipo==='scarto'&&ps.some(p=>p.id===m.prod));const car=S.movimenti.filter(m=>m.tipo==='carico'&&ps.some(p=>p.id===m.prod));
    const q=car.length?sum(sc,m=>m.q)/Math.max(1,sum(car,m=>m.q))*100:null;
    const fa=S.fatture.filter(x=>x.forn===f.id);const a30=sum(fa.filter(x=>new Date(x.data)>=d30),x=>x.tot);
    const dp=fa.filter(x=>x.stato!=='Pagata');const scd=dp.filter(x=>diffDays(x.scadenza,NOW)<0);
    const rate=(l,v)=>`<div><span class="muted">${l}</span>${v==null?'<div>Da valutare</div>':`<div class="bar"><i class="${v<4?'warn':''}" style="width:${v*20}%"></i></div><div class="num">${v.toLocaleString('it-IT')} / 5</div>`}</div>`;
    return `<div class="card"><div class="card-h"><div><h2>${esc(f.nome)}</h2><div class="small muted">${esc(f.tipo)}</div></div>${q==null?'<span class="chip">Nuovo</span>':`<span class="chip ${q>8?'warn':'ok'}">Scarto ${q.toFixed(1)}%</span>`}</div><div class="card-b stack" style="gap:10px">
    <div class="grid g3"><div><div class="muted small">Acquistato 30 gg</div><b class="num">${eur(a30)}</b></div><div><div class="muted small">Da pagare</div><b class="num">${eur(sum(dp,x=>x.tot))}</b></div><div><div class="muted small">Scaduto</div><b class="num" style="color:${scd.length?'var(--bad)':'inherit'}">${eur(sum(scd,x=>x.tot))}</b></div></div>
    <div class="grid g2 small"><div><span class="muted">Contatto</span><div>${esc(f.contatto)}</div><div class="num">${esc(f.tel)}</div><div>${esc(f.email)}</div></div><div><span class="muted">Consegne</span><div>${esc(f.giorni)}</div><span class="muted">Pagamento</span><div>${esc(f.pagamento)}</div></div></div>
    <div class="grid g2 small">${rate('Qualità',f.qualita)}${rate('Puntualità',f.puntualita)}</div>
    <div class="small"><span class="muted">Prodotti forniti (${ps.length}):</span> ${ps.map(p=>esc(p.nome)).join(', ')||'nessuno ancora'}</div>
    <div class="actions"><button class="btn sm" data-act="acqFornGo" data-v="${f.id}">Fatture</button><button class="btn sm" data-act="goOrdF">Ordini</button></div></div></div>`}).join('')}</div>`;
};

VIEWS.acquisti=()=>{
  const ms=mStart(),end=daysAgo(-1);
  const fa=S.fatture.slice().sort((a,b)=>new Date(b.data)-new Date(a.data));
  const mese=fa.filter(x=>inPer(x.data,ms,end));
  const dp=fa.filter(x=>x.stato!=='Pagata');const scd=dp.filter(x=>diffDays(x.scadenza,NOW)<0);const sett=dp.filter(x=>{const g=diffDays(x.scadenza,NOW);return g>=0&&g<=7});
  let body='';
  if(UI.acqTab==='fatture'){
    let rows=fa;if(UI.acqForn)rows=rows.filter(x=>x.forn===UI.acqForn);
    if(UI.acqStato==='Da pagare')rows=rows.filter(x=>x.stato!=='Pagata');else if(UI.acqStato==='Pagate')rows=rows.filter(x=>x.stato==='Pagata');
    body=`<div class="card"><div class="card-h" style="flex-wrap:wrap"><div class="seg">${['Tutte','Da pagare','Pagate'].map(k=>`<button data-act="acqStato" data-v="${k}" class="${UI.acqStato===k?'on':''}">${k}</button>`).join('')}</div><select class="inp" style="max-width:300px" data-in="acqForn" id="acq-f" aria-label="Filtra per fornitore"><option value="">Tutti i fornitori</option>${S.fornitori.map(f=>`<option value="${f.id}" ${UI.acqForn===f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select></div>
    <div class="card-b small muted" style="display:flex;gap:18px;flex-wrap:wrap"><span><b class="num" style="color:var(--ink)">${rows.length}</b> documenti</span><span>Totale <b class="num" style="color:var(--ink)">${eur(sum(rows,x=>x.tot))}</b></span><span>di cui IVA <b class="num" style="color:var(--ink)">${eur(sum(rows,x=>x.iva))}</b></span></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Documento</th><th>Fornitore</th><th>Data</th><th>Scadenza</th><th class="r">Imponibile</th><th class="r">IVA</th><th class="r">Totale</th><th>Stato</th><th></th></tr></thead><tbody>
    ${rows.slice(0,150).map(x=>{const s=payState(x);return `<tr><td class="num">${esc(x.num)}${x.ordine?`<div class="small muted">da ordine n. ${x.ordine}</div>`:''}${x.doc?`<div class="small muted">Allegato: ${esc(x.doc)}</div>`:''}</td><td>${esc(forn(x.forn).nome)}</td><td>${fD(x.data)}</td><td>${fD(x.scadenza)}</td><td class="r">${eur(x.imp)}</td><td class="r">${eur(x.iva)}</td><td class="r"><b>${eur(x.tot)}</b></td><td><span class="chip ${s.c}">${s.t}</span>${x.pagataIl?`<div class="small muted">${fD(x.pagataIl)} · ${esc(x.metodo)}</div>`:''}</td><td class="r">${x.stato!=='Pagata'?`<button class="btn sm" data-act="payDoc" data-v="fatture|${x.id}" ${isTit()?'':'disabled'}>Registra pagamento</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Nessuna fattura</td></tr>'}
    </tbody></table></div></div>`;
  }else{
    const d30=daysAgo(29);
    const rows=S.fornitori.map(f=>{const x=S.fatture.filter(y=>y.forn===f.id);const o=x.filter(y=>y.stato!=='Pagata');const nx=o.slice().sort((a,b)=>new Date(a.scadenza)-new Date(b.scadenza))[0];const r30=x.filter(y=>new Date(y.data)>=d30);return{f,a30:sum(r30,y=>y.tot),n:r30.length,dp:sum(o,y=>y.tot),nx}});
    body=`<div class="grid g21"><div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Fornitore</th><th class="r">Fatture 30 gg</th><th class="r">Acquistato 30 gg</th><th class="r">Da pagare</th><th>Prossima scadenza</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-act="acqFornGo" data-v="${r.f.id}"><td><b>${esc(r.f.nome)}</b><div class="small muted">${esc(r.f.pagamento)}</div></td><td class="r">${r.n}</td><td class="r">${eur(r.a30)}</td><td class="r">${eur(r.dp)}</td><td>${r.nx?`${fD(r.nx.scadenza)} <span class="chip ${payState(r.nx).c}">${payState(r.nx).t}</span>`:'—'}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="card-h"><h2>Acquisti per fornitore · 30 giorni</h2></div><div class="card-b">${hbars(rows.slice().sort((a,b)=>b.a30-a.a30).map(r=>({l:r.f.nome.replace(' (demo)',''),v:r.a30})))}</div></div></div>`;
  }
  return head('Acquisti e fatture fornitori','Tutto quello che il negozio compra per la merce: fatture, scadenze e pagamenti',`<button class="btn" data-act="goOrdF">${ic('clipboard',15)} Ordini ai fornitori</button><button class="btn citrus" data-act="scanDoc">${ic('scan',15)} Importa o scansiona</button><button class="btn primary" data-act="newFatt">${ic('plus',15)} Registra fattura</button>`)+
  `<div class="grid g4">${kpi('Acquistato nel mese',eur(sum(mese,x=>x.tot)),`${mese.length} documenti dal ${fD(ms)}`)}${kpi('Da pagare ai fornitori',eur(sum(dp,x=>x.tot)),`${dp.length} fatture aperte`)}${kpi('Scadute',eur(sum(scd,x=>x.tot)),`${scd.length} fatture`,scd.length?'var(--bad)':'')}${kpi('In scadenza entro 7 giorni',eur(sum(sett,x=>x.tot)),`${sett.length} fatture`)}</div>

VIEWS.spese=()=>{
  const ms=mStart(),end=daysAgo(-1);
  const all=S.spese.slice().sort((a,b)=>new Date(b.scadenza)-new Date(a.scadenza));
  const mese=all.filter(x=>inPer(x.data,ms,end));
  const dp=all.filter(x=>x.stato!=='Pagata');const scd=dp.filter(x=>diffDays(x.scadenza,NOW)<0);const n30=dp.filter(x=>{const g=diffDays(x.scadenza,NOW);return g>=0&&g<=30});
  let rows=all;if(UI.speseCat!=='Tutte')rows=rows.filter(x=>x.cat===UI.speseCat);
  if(UI.speseStato==='Da pagare')rows=rows.filter(x=>x.stato!=='Pagata');else if(UI.speseStato==='Pagate')rows=rows.filter(x=>x.stato==='Pagata');
  const byCat={};mese.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.tot);
  const cats=['Tutte',...SPESE_CAT.filter(c=>S.spese.some(x=>x.cat===c))];
  const scad=[...S.spese.map(x=>({...x,k:x.descr,coll:'spese'})),...S.fatture.map(x=>({...x,k:'Fattura '+forn(x.forn).nome.replace(' (demo)',''),coll:'fatture'}))].filter(x=>x.stato!=='Pagata'&&diffDays(x.scadenza,NOW)<=30).sort((a,b)=>new Date(a.scadenza)-new Date(b.scadenza));
  return head('Spese generali','Affitto, bollette, telefono, commercialista e tutte le altre spese del negozio',`<button class="btn citrus" data-act="scanDoc" ${isTit()?'':'disabled'}>${ic('scan',15)} Importa o scansiona</button><button class="btn primary" data-act="newSpesa" ${isTit()?'':'disabled'}>${ic('plus',15)} Nuova spesa</button>`)+
  `<div class="grid g4">${kpi('Spese del mese',eur(sum(mese,x=>x.tot)),`${mese.length} documenti dal ${fD(ms)}`)}${kpi('Da pagare',eur(sum(dp,x=>x.tot)),`${dp.length} spese aperte`)}${kpi('Scadute',eur(sum(scd,x=>x.tot)),`${scd.length} spese`,scd.length?'var(--bad)':'')}${kpi('In scadenza entro 30 giorni',eur(sum(n30,x=>x.tot)),`${n30.length} spese`)}</div>
  <div class="grid g21" style="margin-top:16px"><div class="card"><div class="card-h" style="flex-wrap:wrap;align-items:flex-start"><div class="cats">${cats.map(c=>`<button data-act="speseCat" data-v="${c}" class="${UI.speseCat===c?'on':''}">${c}</button>`).join('')}</div><div class="seg">${['Tutte','Da pagare','Pagate'].map(k=>`<button data-act="speseStato" data-v="${k}" class="${UI.speseStato===k?'on':''}">${k}</button>`).join('')}</div></div>
   <div class="tblwrap"><table class="tbl"><thead><tr><th>Spesa</th><th>Categoria</th><th>Ricorrenza</th><th>Scadenza</th><th class="r">Importo</th><th>Stato</th><th></th></tr></thead><tbody>
   ${rows.map(x=>{const s=payState(x);return `<tr><td><b>${esc(x.descr)}</b><div class="small muted">${esc(x.ben)}${x.doc?' · allegato: '+esc(x.doc):''}</div></td><td>${esc(x.cat)}</td><td>${esc(x.ric)}</td><td>${fD(x.scadenza)}</td><td class="r"><b>${eur(x.tot)}</b>${x.iva?`<div class="small muted">IVA ${eur(x.iva)}</div>`:''}</td><td><span class="chip ${s.c}">${s.t}</span>${x.pagataIl?`<div class="small muted">${fD(x.pagataIl)} · ${esc(x.metodo)}</div>`:''}</td><td class="r">${x.stato!=='Pagata'?`<button class="btn sm" data-act="payDoc" data-v="spese|${x.id}" ${isTit()?'':'disabled'}>Registra pagamento</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Nessuna spesa</td></tr>'}
   </tbody></table></div></div>
  <div class="stack"><div class="card"><div class="card-h"><h2>Scadenzario 30 giorni</h2><span class="small muted">spese e fornitori</span></div><div class="card-b list">${scad.map(x=>{const s=payState(x);return `<div class="li"><span class="stripe" style="background:var(--${s.c==='ok'?'ok':s.c})"></span><div class="grow"><b>${esc(x.k)}</b><div class="small muted">${fD(x.scadenza)} · <span style="color:var(--${s.c})">${s.t}</span></div></div><b class="num">${eur(x.tot)}</b></div>`}).join('')||'<div class="empty small">Nessuna scadenza nei prossimi 30 giorni</div>'}</div></div>

  <div class="alert info small">Registrare un pagamento qui non sposta denaro: serve solo a tenere traccia di cosa è stato pagato.</div></div></div>`;

VIEWS.contoeconomico=()=>{
  const mese=UI.cePer==='mese';const a=mese?mStart():daysAgo(29),b=daysAgo(-1);
  const vs=salesIn(a,b);let ric=0;
  vs.forEach(v=>{const lordo=sum(v.righe,r=>Math.round(r.q*r.pr))||1;const f=v.tot/lordo;v.righe.forEach(r=>{ric+=Math.round(r.q*r.pr)*f/(1+prod(r.p).iva/100)})});
  ric=Math.round(ric);const incassi=sum(vs,v=>v.tot);
  const acq=sum(S.fatture.filter(x=>inPer(x.data,a,b)),x=>x.imp);
  const sp=S.spese.filter(x=>inPer(x.data,a,b));const byCat={};sp.forEach(x=>byCat[x.cat]=(byCat[x.cat]||0)+x.imp);const spT=sum(sp,x=>x.imp);
  const mc=ric-acq,ris=mc-spT;
  const pc=v=>ric?(v/ric*100).toFixed(1).replace('.',',')+'%':'—';
  const row=(l,v,o={})=>`<tr style="${o.b?'font-weight:700;background:var(--surface-2)':''}"><td style="${o.i?'padding-left:30px;color:var(--muted)':''}">${l}</td><td class="r" style="${o.col?'color:'+o.col:''}">${o.neg&&v?'− ':''}${eur(Math.abs(v)*(o.neg?1:Math.sign(v)||1))}</td><td class="r muted">${pc(Math.abs(v))}</td></tr>`;
  const pagF=sum(S.fatture.filter(x=>x.pagataIl&&inPer(x.pagataIl,a,b)),x=>x.tot),pagS=sum(S.spese.filter(x=>x.pagataIl&&inPer(x.pagataIl,a,b)),x=>x.tot);
  const saldo=incassi-pagF-pagS;
  const imp30=[...S.fatture,...S.spese].filter(x=>x.stato!=='Pagata'&&diffDays(x.scadenza,NOW)<=30);
  return head('Conto economico',`${mese?'Mese in corso, dal '+fD(a):'Ultimi 30 giorni, dal '+fD(a)} a oggi · stima gestionale, non sostituisce il bilancio`,`<div class="seg"><button data-act="cePer" data-v="mese" class="${mese?'on':''}">Mese in corso</button><button data-act="cePer" data-v="30" class="${mese?'':'on'}">Ultimi 30 giorni</button></div>`)+
  `<div class="grid g4">${kpi('Ricavi netti',eur(ric),'Vendite al netto dell\'IVA')}${kpi('Acquisti di merce',eur(acq),pc(acq)+' dei ricavi')}${kpi('Spese generali',eur(spT),pc(spT)+' dei ricavi')}${kpi('Risultato stimato',eur(ris),pc(ris)+' dei ricavi',ris>=0?'var(--ok)':'var(--bad)')}</div>
  <div class="grid g21" style="margin-top:16px"><div class="card"><div class="card-h"><h2>Dai ricavi al risultato</h2><span class="small muted">importi al netto dell'IVA</span></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Voce</th><th class="r">Importo</th><th class="r">% sui ricavi</th></tr></thead><tbody>
   ${row('Ricavi delle vendite',ric,{b:1})}
   ${row('Acquisti di merce dai fornitori',acq,{neg:1})}
   ${row('Margine commerciale',mc,{b:1})}
   ${row('Spese generali',spT,{neg:1})}
   ${Object.entries(byCat).sort((x,y)=>y[1]-x[1]).map(([k,v])=>row(esc(k),v,{neg:1,i:1})).join('')}
   ${row('Risultato gestionale stimato',ris,{b:1,col:ris>=0?'var(--ok)':'var(--bad)'})}
  </tbody></table></div><div class="card-b small muted">Esclusi: imposte sul reddito, contributi previdenziali del titolare, ammortamenti e variazione delle rimanenze. Gli acquisti sono contati alla data della fattura.</div></div>
  <div class="stack"><div class="card"><div class="card-h"><h2>Entrate e uscite di cassa</h2></div><div class="card-b stack" style="gap:8px">
   <div class="tot-row"><span>Incassi dalle vendite (IVA inclusa)</span><b class="num up">${eur(incassi)}</b></div>
   <div class="tot-row"><span>Pagamenti ai fornitori</span><b class="num down">− ${eur(pagF)}</b></div>
   <div class="tot-row"><span>Pagamenti di spese generali</span><b class="num down">− ${eur(pagS)}</b></div>
   <div class="tot-row" style="border-top:1px solid var(--line);padding-top:8px"><b>Saldo del periodo</b><b class="num" style="color:${saldo>=0?'var(--ok)':'var(--bad)'}">${eur(saldo)}</b></div>
   <div class="small muted">Comprende solo i pagamenti registrati nel gestionale.</div></div></div>
  <div class="card"><div class="card-h"><h2>Da pagare nei prossimi 30 giorni</h2></div><div class="card-b stack" style="gap:8px"><div class="tot-row"><span>Fornitori</span><b class="num">${eur(sum(imp30.filter(x=>x.forn),x=>x.tot))}</b></div><div class="tot-row"><span>Spese generali</span><b class="num">${eur(sum(imp30.filter(x=>!x.forn),x=>x.tot))}</b></div><button class="btn sm" data-act="go" data-v="spese">Apri scadenzario</button></div></div>
  <div class="alert warn small">Questi numeri servono a capire l'andamento del negozio. Per i conti ufficiali fa fede il commercialista.</div></div></div>`;
};

  return `<?xml version="1.0" encoding="UTF-8"?><p:FatturaElettronica versione="FPR12" xmlns:p="http://ivaservizi.agenziaentrate.gov.it/docs/xsd/fatture/v1.2"><FatturaElettronicaHeader><CedentePrestatore><DatiAnagrafici><IdFiscaleIVA><IdPaese>IT</IdPaese><IdCodice>${S1.piva}</IdCodice></IdFiscaleIVA><Anagrafica><Denominazione>${S1.nome}</Denominazione></Anagrafica></DatiAnagrafici></CedentePrestatore></FatturaElettronicaHeader><FatturaElettronicaBody><DatiGenerali><DatiGeneraliDocumento><TipoDocumento>TD01</TipoDocumento><Divisa>EUR</Divisa><Data>${d(0)}</Data><Numero>${S1.num}</Numero><ImportoTotaleDocumento>${tot}</ImportoTotaleDocumento></DatiGeneraliDocumento></DatiGenerali><DatiBeniServizi>${lines}<DatiRiepilogo><AliquotaIVA>${S1.al}</AliquotaIVA><ImponibileImporto>${imp.toFixed(2)}</ImponibileImporto><Imposta>${iva.toFixed(2)}</Imposta></DatiRiepilogo></DatiBeniServizi><DatiPagamento><DettaglioPagamento><ModalitaPagamento>MP05</ModalitaPagamento><DataScadenzaPagamento>${d(S1.scad)}</DataScadenzaPagamento><ImportoPagamento>${tot}</ImportoPagamento></DettaglioPagamento></DatiPagamento></FatturaElettronicaBody></p:FatturaElettronica>`;
}
function parseFPA(text){
  const m=text.match(/<([A-Za-z0-9_]+:)?FatturaElettronica[\s>][\s\S]*<\/([A-Za-z0-9_]+:)?FatturaElettronica>/);
  if(!m)throw new Error('Nel file non c\'è una fattura elettronica leggibile.');
  const doc=new DOMParser().parseFromString(m[0].replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''),'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Il file della fattura è danneggiato o in un formato non previsto.');
  const g=(el,t)=>{const x=el?el.getElementsByTagName(t)[0]:null;return x?x.textContent.trim():''};
  const ced=doc.getElementsByTagName('CedentePrestatore')[0];const dg=doc.getElementsByTagName('DatiGeneraliDocumento')[0];
  if(!ced||!dg)throw new Error('Mancano i dati del fornitore o del documento.');
  const nome=g(ced,'Denominazione')||(g(ced,'Nome')+' '+g(ced,'Cognome')).trim();
  const piva=g(ced.getElementsByTagName('IdFiscaleIVA')[0],'IdCodice');
  let imp=0,iva=0,al=0;for(const r of doc.getElementsByTagName('DatiRiepilogo')){imp+=parseFloat(g(r,'ImponibileImporto'))||0;iva+=parseFloat(g(r,'Imposta'))||0;al=Math.max(al,parseFloat(g(r,'AliquotaIVA'))||0)}
  const td=parseFloat(g(dg,'ImportoTotaleDocumento'));
  const descr=[...doc.getElementsByTagName('Descrizione')].slice(0,3).map(x=>x.textContent.trim()).join(', ');
  return{fonte:'Fattura elettronica',nome,piva,num:g(dg,'Numero'),data:g(dg,'Data'),imp:Math.round(imp*100),iva:Math.round(iva*100),tot:Math.round((isNaN(td)?imp+iva:td)*100),aliq:al,scad:g(doc.documentElement,'DataScadenzaPagamento'),descr,tipo:g(dg,'TipoDocumento')};
}
async function readFPAFile(file){
  const buf=await file.arrayBuffer();
  let t=new TextDecoder('utf-8').decode(buf);
  if(!/FatturaElettronica/.test(t)){const l=new TextDecoder('iso-8859-1').decode(buf);t=l;if(/^\s*MI/.test(l)){try{t=atob(l.replace(/\s/g,''))}catch(e){}}}
  return parseFPA(t);
}

  }else if(/rischio|persi|recuper|non (vengono|tornano)|abbandon/.test(q)){
    const m=custMetrics();const r=S.clienti.filter(c=>!c.anon&&['A rischio','Perso'].includes(m[c.id].seg));F.push('Schede clienti','Storico vendite (45 giorni)','Consensi');
    html=r.length?`<b>${r.length} clienti abituali</b> non tornano da oltre 18 giorni:<ul>${r.map(c=>`<li>${esc(cliNome(c))}: assente da ${m[c.id].giorni} giorni, spesa nel periodo ${eur(m[c.id].spesa)} · consenso marketing ${c.consensi.marketing?'sì':'no'}</li>`).join('')}</ul>Posso preparare messaggi di recupero solo per chi ha dato il consenso. Gli altri si possono salutare in negozio.`:'Nessun cliente a rischio in questo momento.';
    if(r.some(c=>c.consensi.marketing))prop={label:'Apri recupero clienti',act:'go',v:'recupero'};
  }else if(/margin|guadagn|utile|ricarico/.test(q)){
    const vs=salesIn(daysAgo(29),new Date(NOW.getTime()+864e5));const by={};vs.forEach(v=>v.righe.forEach(r=>{const p=prod(r.p);by[p.cat]=by[p.cat]||{i:0,c:0};by[p.cat].i+=Math.round(r.q*r.pr);by[p.cat].c+=Math.round(r.q*p.costo)}));F.push('Vendite 30 giorni','Costi d\'acquisto dell\'ultimo lotto');
    html=`Margine lordo stimato negli ultimi 30 giorni, per categoria:<ul>${Object.entries(by).sort((a,b)=>(b[1].i-b[1].c)-(a[1].i-a[1].c)).map(([k,x])=>`<li>${esc(k)}: ${eur(x.i-x.c)} (${((x.i-x.c)/x.i*100).toFixed(0)}% sul venduto)</li>`).join('')}</ul>È una stima: usa il costo dell'ultimo acquisto e non comprende scarti, affitto e personale.`;
  }else if(/scart|spreco|butta/.test(q)){
    const sc=S.movimenti.filter(m=>m.tipo==='scarto'&&diffDays(NOW,m.data)<30);const by={};sc.forEach(m=>by[m.prod]=(by[m.prod]||0)+Math.round(m.q*prod(m.prod).costo));F.push('Movimenti di scarto (30 giorni)');
    html=`Negli ultimi 30 giorni gli scarti valgono <b>${eur(sum(Object.values(by),x=>x))}</b> a costo. I prodotti con più scarto:<ul>${Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([p,v])=>`<li>${esc(prod(p).nome)}: ${eur(v)}</li>`).join('')}</ul>Per questi prodotti potresti ordinare quantità più piccole e più frequenti.`;
  }else if(/(piu|meglio) vendut|top|migliori prodott|cosa vendo/.test(q)){
    const [l,a,b]=period();const t={};salesIn(a,b).forEach(v=>v.righe.forEach(r=>t[r.p]=(t[r.p]||0)+Math.round(r.q*r.pr)));F.push('Vendite '+l);
    const rows=Object.entries(t).sort((x,y)=>y[1]-x[1]).slice(0,5);html=rows.length?`I prodotti più venduti ${l} per incasso:<ol>${rows.map(([p,v])=>`<li>${esc(prod(p).nome)}: ${eur(v)}</li>`).join('')}</ol>`:`Non ci sono vendite registrate ${l}.`;
  }else if(/clienti migliori|miglior client|fedeli|chi spende/.test(q)){
    const m=custMetrics();const r=S.clienti.filter(c=>!c.anon).sort((a,b)=>m[b.id].spesa30-m[a.id].spesa30).slice(0,5);F.push('Schede clienti','Vendite 30 giorni');
    html=`I clienti con la spesa più alta negli ultimi 30 giorni:<ol>${r.map(c=>`<li>${esc(cliNome(c))}: ${eur(m[c.id].spesa30)} in ${m[c.id].visite} visite (45 gg)</li>`).join('')}</ol>`;
  }else if(pMatch&&!/incass|fattur/.test(q)){
    const vs=salesIn(daysAgo(29),new Date(NOW.getTime()+864e5));let qt=0,imp=0;vs.forEach(v=>v.righe.forEach(r=>{if(r.p===pMatch.id){qt+=r.q;imp+=Math.round(r.q*r.pr)}}));F.push('Catalogo prodotti','Vendite 30 giorni','Giacenze');
    html=`<b>${esc(pMatch.nome)}</b> · ${eur(pMatch.prezzo)}/${pMatch.unita}, origine ${esc(pMatch.origine)}.<br>Negli ultimi 30 giorni: ${fmtQ(Math.round(qt*1000)/1000,pMatch.unita)} venduti per ${eur(imp)}.<br>Giacenza attuale: ${fmtQ(giacenza(pMatch.id),pMatch.unita)} (scorta minima ${fmtQ(pMatch.soglia,pMatch.unita)}). Margine a prezzo pieno: ${((pMatch.prezzo-pMatch.costo)/pMatch.prezzo*100).toFixed(0)}%.`;
  }else if(/incass|vendut|fattur|quanto ho|scontrin|andat/.test(q)){
    const [l,a,b]=period();const vs=salesIn(a,b);F.push('Vendite '+l);
    html=vs.length?`${l[0].toUpperCase()+l.slice(1)} hai incassato <b>${eur(sum(vs,v=>v.tot))}</b> con <b>${vs.length}</b> scontrini (media ${eur(sum(vs,v=>v.tot)/vs.length)}). Il ${Math.round(vs.filter(v=>v.cliente).length/vs.length*100)}% delle vendite è associato a un cliente.`:`Non ci sono vendite registrate ${l}.`;
  }else{
    html='Posso rispondere su incassi, prodotti più venduti, scorte, lotti in scadenza, margini, scarti e clienti a rischio, sempre a partire dai dati del gestionale. Prova a chiedere, ad esempio: «Quanto ho incassato ieri?» oppure «Cosa devo riordinare?».<br>Se un dato non è presente nel sistema, te lo dirò invece di stimarlo.';
  }
  return{html,F,prop};
}

function approve(id){
  const a=S.approvazioni.find(x=>x.id===id);
  if(a.tipo==='campagna'){const k=S.campagne.find(x=>x.id===a.ref);if(k)k.stato='approvata'}
  if(a.tipo==='prezzo'){const p=prod(a.ref);const o=p.prezzo;p.prezzo=a.valore;log('Prezzo',`${p.nome}: da ${eur(o)} a ${eur(a.valore)} (approvato)`)}
  if(a.tipo==='reso'){const v=S.vendite.find(x=>x.id===a.ref);if(v&&v.stato==='ok')doReso(v)}
  if(a.tipo==='ordine'){const o=S.acquisti.find(x=>x.id===a.ref);if(o)o.stato='Inviato'}
  if(a.tipo==='recupero'){const k=S.campagne.find(x=>x.id===a.ref);if(k)k.stato='approvata'}
  a.stato='approvata';a.esito='Approvata da '+ME().nome+' il '+fDT(new Date());log('Approvazione',a.titolo);render();toast('Operazione approvata.');
}
