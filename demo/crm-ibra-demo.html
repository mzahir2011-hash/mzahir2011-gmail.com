/* ============ Modalità d'uso reale: archivio privato nel cloud ============ */
function emptyState(){const b=seed();return{v:3,giorno:'',fatture:[],spese:[],fornitori:[],prodotti:[],clienti:[],vendite:[],lotti:[],movimenti:[],conversazioni:[],campagne:[],approvazioni:[],ordini:[],acquisti:[],automazioni:b.automazioni.map(a=>({...a,ultima:null,esiti:0})),feedback:[],referral:[],fedeltaMov:[],registro:[],notifiche:[],chiusureRT:[],impostazioni:b.impostazioni}}
const DAILY=['vendite','movimenti','registro','fedeltaMov'];
const ENT=['fatture','spese','fornitori','prodotti','clienti','lotti','conversazioni','campagne','approvazioni','ordini','acquisti','automazioni','chiusureRT','notifiche','feedback','referral'];
let DEV='';try{DEV=localStorage.getItem('crmibra_dev')||'';if(!DEV){DEV='d'+Math.random().toString(36).slice(2,8);localStorage.setItem('crmibra_dev',DEV)}}catch(e){DEV='d'+Math.random().toString(36).slice(2,8)}
let DB=null,DL=null,LAST=new Map(),syncT=null,writing=Promise.resolve();
const SYNC={st:REALE?'carico':'',msg:''};
const dayKey=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const safeId=s=>String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,150);
function toDocs(){
  const m=new Map();
  for(const k of DAILY){const g={};for(const x of S[k]){if(!x.id)x.id=uid('R');if(!x._dev)x._dev=DEV;const key=dayKey(x.data)+'~'+x._dev;(g[key]=g[key]||[]).push(x)}for(const d in g)m.set(k+'/'+d,{items:g[d]})}
  for(const k of ENT){for(const x of S[k]){if(!x._id)x._id=safeId(x.id||x.giorno&&dayKey(x.giorno)||uid('x'));m.set(k+'/'+x._id,{item:x})}}
  m.set('meta/stato',{impostazioni:S.impostazioni,syncDone:!!S.syncDone});
  return m;
}
function setSync(st,msg){SYNC.st=st;SYNC.msg=msg||'';const e=document.getElementById('sync');if(e)e.innerHTML=syncHtml()}
function syncHtml(){if(!REALE)return'';const t={carico:['info','Caricamento…'],salvo:['info','Salvataggio…'],ok:['ok','Salvato'],errore:['bad','Non salvato'],off:['bad','Archivio non raggiungibile']}[SYNC.st]||['',''];return `<span class="chip ${t[0]}" title="${esc(SYNC.msg)}">${t[1]}</span>`}
function scheduleSync(){if(!REALE||!DB||SYNC.st==='carico')return;clearTimeout(syncT);syncT=setTimeout(doSync,500)}
async function writeDoc(p,b){if(b)await DB.doc(p).set(b);else await DB.doc(p).delete()}
function doSync(){
  const m=toDocs();const ops=[];
  for(const [p,b] of m){const j=JSON.stringify(b);if(LAST.get(p)!==j)ops.push([p,b,j])}
  for(const p of [...LAST.keys()])if(!m.has(p))ops.push([p,null,null]);
  if(!ops.length)return;setSync('salvo');
  writing=writing.then(async()=>{
    for(const [p,b,j] of ops){
      let err=null;try{await writeDoc(p,b)}catch(e){err=e}
      if(err&&err.code==='unavailable'){await new Promise(r=>setTimeout(r,700+Math.random()*900));try{await writeDoc(p,b);err=null}catch(e2){err=e2}}
      if(err){const q=err.code==='quota_exceeded';setSync('errore',q?'Spazio dell\'archivio esaurito: scarica un backup.':'Salvataggio non riuscito ('+(err.code||'errore')+'). Riprovo alla prossima modifica.');toast(q?'Spazio dell\'archivio esaurito: scarica subito un backup.':'Attenzione: salvataggio non riuscito. Controlla la connessione.','warn');return}
      if(j)LAST.set(p,j);else LAST.delete(p);
    }
    setSync('ok');
  });
}
function applyRemote(coll,snap){
  let changed=false;
  for(const ch of snap.docChanges()){
    const p=coll+'/'+ch.doc.id;const d=ch.doc.data();
    if(ch.type==='removed'){if(!LAST.has(p))continue;LAST.delete(p);
      if(DAILY.includes(coll)){const [day,dev]=ch.doc.id.split('~');S[coll]=S[coll].filter(x=>!(dayKey(x.data)===day&&x._dev===dev))}
      else if(coll!=='meta'){S[coll]=S[coll].filter(x=>x._id!==ch.doc.id)}
      changed=true;continue}
    if(ch.doc.metadata.hasPendingWrites)continue;
    const j=JSON.stringify(d);if(LAST.get(p)===j)continue;LAST.set(p,j);changed=true;
    if(coll==='meta'){if(d.impostazioni)S.impostazioni=d.impostazioni;S.syncDone=d.syncDone;continue}
    if(DAILY.includes(coll)){for(const it of (d.items||[])){const i=S[coll].findIndex(x=>x.id===it.id);const c=JSON.parse(JSON.stringify(it));if(i<0)S[coll].push(c);else S[coll][i]=c}}
    else{const it=JSON.parse(JSON.stringify(d.item||{}));const i=S[coll].findIndex(x=>x._id===ch.doc.id);if(i<0)S[coll].push(it);else S[coll][i]=it}
  }
  if(changed){sortState();if(!$('#overlay').classList.contains('show'))render();else renderNav()}
}
function sortState(){S.vendite.sort((a,b)=>new Date(a.data)-new Date(b.data));S.registro.sort((a,b)=>new Date(b.data)-new Date(a.data));S.fedeltaMov.sort((a,b)=>new Date(b.data)-new Date(a.data))}
async function initCloud(){
  const timer=setTimeout(()=>{if(SYNC.st==='carico'){setSync('off','L\'archivio non risponde: controlla la connessione.');render()}},10000);
  let db=null;try{db=await claude.use('db')}catch(e){}
  try{DL=await claude.use('downloads')}catch(e){}
  if(!db){clearTimeout(timer);setSync('off','Archivio non disponibile: apri la pagina da claude.ai con il tuo account.');render();return}
  DB=db;
  try{
    const colls=[...DAILY,...ENT,'meta'];
    const snaps=await Promise.all(colls.map(c=>DB.collection(c).get()));
    snaps.forEach((sn,i)=>{const c=colls[i];if(c==='automazioni'&&sn.docs.length)S.automazioni=[];for(const d of sn.docs){const b=d.data();LAST.set(c+'/'+d.id,JSON.stringify(b));
      if(c==='meta'){if(b.impostazioni)S.impostazioni=b.impostazioni;S.syncDone=b.syncDone}
      else if(DAILY.includes(c))(b.items||[]).forEach(it=>S[c].push(JSON.parse(JSON.stringify(it))));
      else S[c].push(JSON.parse(JSON.stringify(b.item)))}});
    sortState();clearTimeout(timer);setSync('ok');if(UI.role==='titolare'&&!isUnlocked())UI.role='addetto';render();
    colls.forEach(c=>DB.collection(c).onSnapshot(sn=>applyRemote(c,sn),e=>{if(e&&e.code==='revoked')setSync('off','Accesso all\'archivio revocato.')}));
    scheduleSync();
  }catch(e){clearTimeout(timer);setSync('off','Errore di caricamento ('+(e&&e.code||'sconosciuto')+').');render()}
}
async function backupDownload(){
  const data=JSON.stringify({app:'CRM IBRA',versione:1,creato:new Date().toISOString(),dati:S},null,1);
  const name='crm-ibra-backup-'+dayKey(new Date())+'.json';
  if(DL){try{await DL.save({filename:name,data});log('Backup','Backup scaricato: '+name);toast('Backup pronto: conservalo in un posto sicuro (es. Google Drive).');return}catch(e){}}
  navigator.clipboard.writeText(data).then(()=>toast('Download non disponibile: backup copiato negli appunti.')).catch(()=>toast('Impossibile creare il backup su questo dispositivo.','warn'));

async function makePdf(o){
  const {jsPDF}=await loadPdf();const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=14,G=[44,138,75],INK=[22,34,27],MU=[93,106,98];const az=AZ();
  const header=()=>{
    try{doc.addImage(LOGO(),'JPEG',M,9,30,30)}catch(e){}
    doc.setTextColor(...INK);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(pt(az.insegna),M+35,19);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);
    let y=25;[az.indirizzo,az.piva?'P.IVA '+az.piva:'',az.tel?'Tel. '+az.tel:''].filter(Boolean).forEach(l=>{doc.text(pt(l),M+35,y);y+=4.5});
    doc.setTextColor(...G);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(pt(o.titolo),W-M,19,{align:'right'});
    doc.setTextColor(...MU);doc.setFont('helvetica','normal');doc.setFontSize(9);(o.sotto||[]).forEach((l,i)=>doc.text(pt(l),W-M,25+i*4.5,{align:'right'}));
    doc.setDrawColor(...G);doc.setLineWidth(.6);doc.line(M,43,W-M,43);
  };
  header();let y=51;
  const need=h=>{if(y+h>H-20){doc.addPage();header();y=51}};
  (o.blocchi||[]).forEach(b=>{need(8+b.righe.length*5);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...INK);doc.text(pt(b.t),M,y);y+=5;doc.setFont('helvetica','normal');doc.setFontSize(9.5);b.righe.forEach(r=>{doc.text(pt(r),M,y);y+=4.8});y+=3});
  if(o.colonne){
    const cols=o.colonne;const tw=W-2*M;let x=M;const xs=cols.map(c=>{const s=x;x+=c.w*tw;return s});
    const th=()=>{doc.setFillColor(242,246,241);doc.rect(M,y-4.5,tw,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...MU);cols.forEach((c,i)=>doc.text(pt(c.t).toUpperCase(),c.r?xs[i]+c.w*tw-2:xs[i]+2,y,{align:c.r?'right':'left'}));y+=7};
    th();doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...INK);
    o.righe.forEach(r=>{const lines=doc.splitTextToSize(pt(r[0]),cols[0].w*tw-4);const h=Math.max(6,lines.length*4.6+1.4);if(y+h>H-24){doc.addPage();header();y=51;th();doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...INK)}
      if(r.b)doc.setFont('helvetica','bold');doc.text(lines,xs[0]+2,y);r.slice(1).forEach((v,i)=>{const c=cols[i+1];doc.text(pt(v),c.r?xs[i+1]+c.w*tw-2:xs[i+1]+2,y,{align:c.r?'right':'left'})});if(r.b)doc.setFont('helvetica','normal');
      y+=h-1.4;doc.setDrawColor(225,230,223);doc.setLineWidth(.2);doc.line(M,y-3.2,W-M,y-3.2);y+=1.4});
    y+=3;
  }
  (o.totali||[]).forEach((t,i,a)=>{need(8);const last=i===a.length-1;doc.setFont('helvetica',last?'bold':'normal');doc.setFontSize(last?12:10);doc.setTextColor(...INK);doc.text(pt(t[0]),W-M-55,y);doc.text(pt(t[1]),W-M,y,{align:'right'});y+=last?7:5.5});
  if(o.note){y+=4;need(20);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MU);const l=doc.splitTextToSize(pt(o.note),W-2*M);doc.text(l,M,y);y+=l.length*4}
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7.5);doc.setTextColor(...MU);doc.setFont('helvetica','normal');doc.text(pt(`${az.insegna} · documento generato con CRM IBRA il ${fDT(new Date())}${REALE?'':' · DOCUMENTO DIMOSTRATIVO, dati inventati'}`),M,H-10);doc.text(`${i}/${n}`,W-M,H-10,{align:'right'})}
  return doc.output('blob');
}

/* ============ PIN del titolare ============ */
const LOCK_MIN=15;let UNLOCK_MEM=0,PINFAIL=0,PINWAIT=0;
async function hashPin(pin,salt){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const hasPin=()=>!!(S&&S.impostazioni&&S.impostazioni.pinHash);
function unlockTs(){try{return +sessionStorage.getItem('crmibra_unlock')||UNLOCK_MEM}catch(e){return UNLOCK_MEM}}
function setUnlock(t){UNLOCK_MEM=t;try{sessionStorage.setItem('crmibra_unlock',String(t))}catch(e){}}
const isUnlocked=()=>!hasPin()||Date.now()-unlockTs()<LOCK_MIN*6e4;
function askPin(title,ok){
  if(Date.now()<PINWAIT){toast('Troppi tentativi: riprova tra '+Math.ceil((PINWAIT-Date.now())/1000)+' secondi.','warn');return}
  openModal(title,`<div class="field"><label for="pin-in">PIN del titolare</label><input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8" style="font-size:24px;letter-spacing:.35em;text-align:center"></div><div class="small muted">Chi non conosce il PIN non può accedere come titolare.</div>`,
  [{label:'Annulla'},{label:'Conferma',cls:'primary',fn:()=>{const v=val('pin-in');hashPin(v,S.impostazioni.pinSalt).then(h=>{if(h===S.impostazioni.pinHash){PINFAIL=0;setUnlock(Date.now());closeModal();ok()}else{PINFAIL++;if(PINFAIL>=5){PINWAIT=Date.now()+60000;PINFAIL=0;closeModal();log('Sicurezza','5 tentativi di PIN errati','Sistema');toast('PIN errato per 5 volte: bloccato per 1 minuto.','warn')}else{toast('PIN errato.','warn');const i=document.getElementById('pin-in');if(i){i.value='';i.focus()}}}});return false}}]);
}
function withPin(title,fn){if(hasPin())askPin(title,fn);else fn()}
function setRole(r,quiet){UI.role=r;try{sessionStorage.setItem('crmibra_role',r)}catch(_){}UI.aiMsgs=[];if(!quiet)log('Cambio utente','Accesso come '+ME().nome+' ('+ME().ruolo+')');if(!allowed(location.hash.slice(1)))location.hash='cruscotto';render();if(!quiet)toast('Ora stai usando il sistema come '+ME().ruolo+'.')}
function pinModal(){
  const nuovo=()=>openModal(hasPin()?'Cambia PIN del titolare':'Imposta il PIN del titolare',`<div class="small">Scegli un PIN di 4–8 cifre che conosci solo tu. Servirà per entrare come titolare, azzerare i dati e ripristinare un backup.</div><div class="grid g2"><div class="field"><label for="pn1">Nuovo PIN</label><input id="pn1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div class="field"><label for="pn2">Ripeti il PIN</label><input id="pn2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div><div class="small muted">Se dimentichi il PIN non c'è modo di recuperarlo dall'app: annotalo in un posto sicuro.</div>`,
    [{label:'Annulla'},{label:'Salva PIN',cls:'primary',fn:()=>{const a=val('pn1'),b=val('pn2');if(!/^\d{4,8}$/.test(a)){toast('Il PIN deve avere da 4 a 8 cifre.','warn');return false}if(a!==b){toast('I due PIN non coincidono.','warn');return false}if(/^(\d)\1+$/.test(a)||'0123456789'.includes(a)||'9876543210'.includes(a)){toast('PIN troppo facile: evita cifre uguali o in sequenza.','warn');return false}
      const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);hashPin(a,salt).then(h=>{S.impostazioni.pinSalt=salt;S.impostazioni.pinHash=h;setUnlock(Date.now());log('Sicurezza','PIN del titolare impostato');render();toast('PIN salvato. Da ora serve per entrare come titolare.')});}}]);
  if(hasPin())askPin('Conferma il PIN attuale',nuovo);else nuovo();
}
setInterval(()=>{if(UI.role==='titolare'&&hasPin()&&!isUnlocked()){setRole('addetto',true);toast('Sessione del titolare chiusa per inattività.','warn')}},30000);
document.addEventListener('click',()=>{if(UI.role==='titolare'&&hasPin()&&isUnlocked())setUnlock(Date.now())},true);
const PIN_ACTIONS={pinSet:pinModal,pinDel:()=>askPin('Rimuovi il PIN',()=>{delete S.impostazioni.pinHash;delete S.impostazioni.pinSalt;log('Sicurezza','PIN del titolare rimosso');render();toast('PIN rimosso.','warn')}),lock:()=>{setUnlock(0);setRole('addetto',true);toast('Bloccato: per tornare titolare serve il PIN.')}};

  redeem:redeemModal,
