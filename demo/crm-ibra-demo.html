  waQR:d=>{const qr=['Buongiorno! Certo, gliela mettiamo da parte.','Sì, consegniamo a Fontanellato e nei comuni vicini. Che orario preferisce?','Il suo ordine è pronto per il ritiro.','Grazie, a presto!'];const i=$('#wa-in');if(i){i.value=qr[+d.v];i.focus()}},
  waTpl:d=>{const w=S.conversazioni.find(x=>x.id===d.v);const c=cli(w.cliente);w.msgs.push({dir:'out',t:new Date().toISOString(),testo:`Gentile ${c.nome}, il suo ordine presso Frutta e Verdura di Ibrahim è pronto per il ritiro. [Modello «Ordine pronto»]`,sim:true});log('WhatsApp','Modello «Ordine pronto» a '+cliNome(c)+' (simulato)');render()},
  waStop:d=>{const w=S.conversazioni.find(x=>x.id===d.v);const c=cli(w.cliente);w.msgs.push({dir:'in',t:new Date().toISOString(),testo:'STOP'});w.msgs.push({dir:'out',t:new Date().toISOString(),testo:'Abbiamo registrato la sua richiesta: non riceverà più offerte. Continuerà a ricevere solo le comunicazioni sui suoi ordini.',sim:true});c.consensi.marketing=false;c.consensoData=new Date().toISOString();log('Consenso revocato',cliNome(c)+' ha risposto STOP: consenso marketing revocato','Sistema');render();toast('Consenso marketing revocato automaticamente. Il cliente è escluso dalle campagne.')},
  waOrder:d=>newOrdModal(d.v),
  consToggle:(d,el)=>{const [id,k]=d.v.split('|');const c=cli(id);c.consensi[k]=el.checked;c.consensoData=new Date().toISOString();log(el.checked?'Consenso rilasciato':'Consenso revocato',`${cliNome(c)} · ${k}`);save();toast(`Consenso ${k} ${el.checked?'registrato':'revocato'}.`);render();cliModal(id)},
  prodOpen:d=>prodModal(d.v),
  magTab:d=>{UI.magTab=d.v;render()},
  scarto:d=>scartoModal(d.v),
  rettifica:d=>rettificaModal(d.v),
  promoLot:d=>{const l=S.lotti.find(x=>x.id===d.v);const p=prod(l.prod);const np=Math.round(p.prezzo*.7/10)*10;S.approvazioni.unshift({id:uid('A'),tipo:'prezzo',ref:p.id,valore:np,titolo:'Prezzo promozionale '+p.nome,dettaglio:`Da ${eur(p.prezzo)} a ${eur(np)}/${p.unita} (−30%) per vendere il lotto ${l.id} entro il ${fD(l.scadenza)}`,richiedente:ME().nome+' ('+ME().ruolo+')',data:new Date().toISOString(),stato:'in attesa'});log('Proposta promozione',p.nome+' · lotto '+l.id);render();toast('Proposta di prezzo inviata per approvazione.')},
  ordTab:d=>{UI.ordTab=d.v;render()},
  ordNext:d=>{const o=S.ordini.find(x=>x.id===d.v);const nxt={'Confermato':'In preparazione','In preparazione':'Pronto','Pronto':'Consegnato'};o.stato=nxt[o.stato];log('Ordine cliente',`Ordine n. ${o.n} → ${o.stato}`);
    if(o.stato==='Pronto'&&S.automazioni.find(a=>a.id==='AU3').attiva){const c=cli(o.cliente);let w=S.conversazioni.find(x=>x.cliente===c.id);if(!w){w={id:uid('W'),cliente:c.id,nonLetti:0,msgs:[]};S.conversazioni.push(w)}w.msgs.push({dir:'out',t:new Date().toISOString(),testo:`Gentile ${c.nome}, il suo ordine n. ${o.n} è pronto${o.tipo==='Ritiro'?' per il ritiro':' e partirà a breve per la consegna'}. [Automazione «Ordine pronto»]`,sim:true});log('Automazione','«Ordine pronto» per '+cliNome(c)+' (simulato)','Sistema');toast('Automazione: avviso WhatsApp al cliente (simulato).')}
    render()},
  newOrd:d=>newOrdModal(d.v),
  reorder:()=>{closeModal();reorderModal()},
  receive:d=>receive(d.v),
  periodo:d=>{UI.periodo=+d.v;render()},
  csv:()=>{const rows=[['Data','Scontrini','Incasso EUR']];for(let d=UI.periodo-1;d>=0;d--){const a=daysAgo(d);const vs=salesIn(a,daysAgo(d-1));rows.push([fD(a),vs.length,(sum(vs,v=>v.tot)/100).toFixed(2).replace('.',',')])}
    navigator.clipboard.writeText(rows.map(r=>r.join(';')).join('\n')).then(()=>toast('Tabella incassi copiata: incollala in Excel.')).catch(()=>toast('Copia non consentita dal browser.','warn'));log('Esportazione','Incassi giornalieri '+UI.periodo+' giorni')},
  aiAsk:d=>aiAsk(d.v),
  aiSend:()=>aiAsk(val('ai-in')),
  autoToggle:d=>{const a=S.automazioni.find(x=>x.id===d.v);const go=()=>{a.attiva=!a.attiva;log('Automazione',`${a.nome} ${a.attiva?'attivata':'disattivata'}`);render();toast(`Automazione ${a.attiva?'attivata':'disattivata'}.`)};if(!a.attiva&&a.approvazione)ask('Attivare l\'automazione?',`<b>${esc(a.nome)}</b> contatta i clienti. Ogni messaggio che prepara resterà comunque in attesa della tua approvazione.`,'Attiva',go);else go()},
  autoRun:d=>{const a=S.automazioni.find(x=>x.id===d.v);a.ultima=new Date().toISOString();a.esiti++;let msg='Eseguita: nessuna azione necessaria.';
    if(a.id==='AU1'){const ex=expiring(1);ex.forEach(l=>S.notifiche.unshift({data:new Date().toISOString(),testo:`${prod(l.prod).nome}: lotto ${l.id} da vendere entro ${fD(l.scadenza)}`,letta:false}));msg=`Eseguita: ${ex.length} avvisi creati.`}
    if(a.id==='AU2'){msg=`Eseguita: ${lowStock().length} prodotti sotto scorta. Apri Ordini per la proposta di riordino.`}
    log('Automazione',a.nome+' eseguita manualmente');render();toast(msg)},
  apprOk:d=>approve(d.v),
  apprNo:d=>{const a=S.approvazioni.find(x=>x.id===d.v);openModal('Rifiuta richiesta',`<div><b>${esc(a.titolo)}</b></div><div class="field"><label for="rj-m">Motivazione (verrà comunicata a chi ha fatto la richiesta)</label><textarea id="rj-m"></textarea></div>`,[{label:'Annulla'},{label:'Rifiuta',cls:'danger',fn:()=>{const m=val('rj-m');if(!m){toast('Scrivi una motivazione.','warn');return false}a.stato='rifiutata';a.esito='Rifiutata: '+m;if(['campagna','recupero'].includes(a.tipo)){const k=S.campagne.find(x=>x.id===a.ref);if(k)k.stato='rifiutata'}if(a.tipo==='ordine'){const o=S.acquisti.find(x=>x.id===a.ref);if(o)o.stato='Bozza'}log('Rifiuto',a.titolo+' · '+m);render();toast('Richiesta rifiutata.')}}])},
  saveSet:()=>{const I=S.impostazioni;I.scontoMaxAddetto=+val('st-sc')||0;I.ordineSoglia=Math.round((parseFloat(val('st-or').replace(',','.'))||0)*100);I.limiteMsgMese=+val('st-mm')||0;log('Impostazioni','Soglie aggiornate');toast('Soglie salvate.')},
  theme:d=>{if(d.v)document.documentElement.setAttribute('data-theme',d.v);else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('crmibra_theme',d.v)}catch(e){}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(!e.target.closest('.gsearch'))$('#gresults').hidden=true;if(e.target===$('#overlay'))closeModal();return}
  if(el.tagName==='INPUT'&&el.type==='checkbox'){}else e.preventDefault();
  const f=A[el.dataset.act];if(f)f(el.dataset,el,e);
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.in;if(!k)return;const v=e.target.value;
  if(k==='pickC'){$('#pc-l').innerHTML=PICK.list(v);return}
  if(k==='cpSeg'){CPSEG();return}
  if(k==='payR'){const t=cartTot().tot;const r=Math.round((parseFloat(v.replace(',','.'))||0)*100);$('#pay-resto').innerHTML=r>=t?`Resto da dare: <b class="num" style="font-size:18px">${eur(r-t)}</b>`:r?`<span class="down">Importo insufficiente</span>`:'';return}
  UI[k]=v;const id=e.target.id;const pos=e.target.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'){if(e.target.id==='ai-in')aiAsk(e.target.value);if(e.target.id==='wa-in'){const b=document.querySelector('[data-act="waSend"]');b&&b.click()}if(e.target.id==='cassa-q'){const t=document.querySelector('.tile');t&&t.click()}}
});
$('#role').addEventListener('change',e=>{UI.role=e.target.value;try{sessionStorage.setItem('crmibra_role',UI.role)}catch(_){}UI.aiMsgs=[];log('Cambio utente','Accesso come '+ME().nome+' ('+ME().ruolo+')');if(!allowed(location.hash.slice(1)))location.hash='cruscotto';render();toast('Ora stai usando il sistema come '+ME().ruolo+'.')});
$('#gsearch').addEventListener('input',e=>{
  const q=norm(e.target.value).replace(/\s/g,'');const box=$('#gresults');if(!q){box.hidden=true;return}
  const cs=S.clienti.filter(c=>!c.anon&&norm(cliNome(c)+c.tel).replace(/\s/g,'').includes(q)).slice(0,5);
  const ps=S.prodotti.filter(p=>norm(p.nome).replace(/\s/g,'').includes(q)||p.plu===q).slice(0,5);
  box.innerHTML=(cs.map(c=>`<button data-act="gC" data-v="${c.id}"><span class="avatar" style="width:24px;height:24px;font-size:10px">${ini(c)}</span>${esc(cliNome(c))}<span class="muted small" style="margin-left:auto">Cliente</span></button>`).join('')+ps.map(p=>`<button data-act="gP" data-v="${p.id}"><span style="width:10px;height:10px;border-radius:50%;background:${CAT_COL[p.cat]}"></span>${esc(p.nome)} <span class="muted small">${eur(p.prezzo)}/${p.unita}</span><span class="muted small" style="margin-left:auto">Prodotto</span></button>`).join(''))||'<div class="empty small">Nessun risultato</div>';box.hidden=false;
});
Object.assign(A,EXTRA_ACTIONS,SCAN_ACTIONS,{rtClose:rtCloseModal});
A.gC=d=>{$('#gresults').hidden=true;$('#gsearch').value='';cliModal(d.v)};
A.gP=d=>{$('#gresults').hidden=true;$('#gsearch').value='';prodModal(d.v)};
try{const t=localStorage.getItem('crmibra_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}
window.addEventListener('hashchange',render);
save();render();
</script>
</body>
</html>
